# ─── Plan and code an issue in one run (label-driven) ──────────────────
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run issue-deliver --var github_repo=owner/repo --var issue=42 --var test_cmd="./gradlew test"
# 
# pull ticket → branch of the open factory PR (or a new one) → baseline tests
#   → Opus plans (xhigh) → Codex checks it (+ its own risk score) → Opus revises
#       NEEDS_INFO / NOT_CODE → ask on the issue → stop (continues when you reply)
#       TOO_BIG → split risk ≤ 50 (or you already agreed) → create the parts as issues, close this one
#               otherwise → post the split, wait for /approve
#   → post the plan with its risk score ─┬─ risk > 75 or label Factory_review_plan → wait for /approve
#                                        │     (/reject + feedback → plans again)
#                                        └─ otherwise → code straight away
#   → Sonnet codes → guard → tests ⟲ fix → 2 × (Codex review → fix → tests) → docs → guard
#   → commit "Resolve #N" → push → open/update the factory PR → report on the issue
# ────────────────────────────────────────────────────────────────────────
name: issue-deliver
description: Plan (Opus + Codex check + risk score) and code (Sonnet + 2 Codex reviews) an issue in one run; risky plans wait for a human
workspace: empty
one_per_repo: true
defaults:
  model: claude-sonnet-5-5
  timeout_sec: 2400
  max_budget_usd: 6
  allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - Bash(./gradlew *)
    - Bash(gradle *)
    - Bash(./mvnw *)
    - Bash(mvn *)
    - Bash(npm *)
    - Bash(npx *)
    - Bash(yarn *)
    - Bash(pnpm *)
    - Bash(pytest*)
    - Bash(python3 -m pytest*)
    - Bash(python -m pytest*)
    - Bash(go test*)
    - Bash(go build*)
    - Bash(go vet*)
    - Bash(cargo *)
    - Bash(make *)
    - Bash(git status*)
    - Bash(git diff*)
    - Bash(git log*)
    - Bash(git show*)
    - Bash(ls*)
    - Bash(find *)
    - Bash(grep *)
    - Bash(cat *)
    - Bash(head *)
    - Bash(tail *)
    - Bash(wc *)
limits:
  max_cost_usd: 40
vars:
  github_repo: owner/repo
  issue: ""
  test_cmd: auto
  branch_prefix: factory/daily-
  timezone: Europe/Berlin
  forbidden_paths: ""
  docs_required: ""
  risk_threshold: "75"
  review_plan_label: Factory_review_plan
  auto_split_max_risk: "50"
  trigger_label: ""
  agent_env: ""
steps:
  - id: pull_ticket
    type: shell
    description: Read the GitHub issue as plain text
    run: |
      case "$FACTORY_VAR_ISSUE" in ''|*[!0-9]*) echo "set the 'issue' variable to an issue number (got '$FACTORY_VAR_ISSUE')"; exit 1;; esac
      gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json number,title,body,url,labels,comments --jq '
        "# #\(.number): \(.title)\n\(.url)\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)\n"
        + ([.comments[] | "\n--- comment by \(.author.login):\n\(.body)"] | join("\n"))'
  - id: daily_branch
    type: shell
    description: Clone, then check out the branch of the open factory PR (or a new one from main)
    run: |-
      if [ -d .git ]; then git reset -q --hard && git clean -qfd && git fetch -q origin; else gh repo clone "$FACTORY_VAR_GITHUB_REPO" . -- -q; fi
      "$FACTORY_TOOLS/daily-branch" prepare
  - id: baseline_tests
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      if [ "$code" -ne 0 ]; then echo "the tests failed — running them once more (a test can fail by chance on a busy machine)"; touch "$marker"; sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?; [ "$code" -eq 0 ] && echo "passed the second time: a flaky test, not a real failure"; fi
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: baseline_failed
    description: Tests must pass before we change anything (a failing run is tried once more)
  - id: plan
    type: claude
    model: claude-opus-5-5
    effort: xhigh
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(git show*)
      - Bash(git grep*)
      - Bash(ls*)
    prompt: |-
      You are the lead architect for this repository. Plan the work for the GitHub issue below so that
      another engineer can implement it without having to make design decisions. Do NOT modify files.

      {{steps.pull_ticket.output}}

      {{steps.clone.output}}
      Paths that must not be changed: {{vars.forbidden_paths}}
      The issue text above already includes all of its comments — do not try to fetch them (gh and web
      access are not available here). They may contain a previous plan and feedback on it — the feedback wins.
      If earlier questions were asked and the owner replied /defaults, take the recommendations as the answers.

      Investigate before you write (this is the most important part):
      - Read CLAUDE.md, the design docs it points to, and the parts of the code this issue touches.
      - Find the existing classes, interfaces and patterns to reuse or extend, and how similar features
        were built. Check how the code is tested today (test style, helpers, fixtures).
      - Verify every class, file, function and module you mention actually exists as you describe it.
        If something must be created, say so explicitly.

      Then decide:
      - NOT_CODE: not a coding task (legal, approval, research, rollout, …). Explain why.
      - TOO_BIG: cannot be done well as one focused, reviewable change. Propose a split into smaller
        issues (title + 2-3 lines each) that can each be built and tested on their own, in order.
        For TOO_BIG, write the split in exactly this format so the factory can create the issues:
          ## Split
          ### ISSUE 1: <title>
          DEPENDS_ON: none   (or earlier parts by number, e.g. 1 or 1, 2; or existing issues, e.g. #72)
          <the issue text: the user story, a "### Acceptance criteria" checklist, and "### Notes for this codebase">
          ### ISSUE 2: <title>
          …
        Each part must be buildable and testable on its own; together they cover every acceptance criterion
        of this issue. Then score how risky it is to create these issues WITHOUT the owner looking (0-100):
        0-25 a mechanical split along existing boundaries, nothing dropped or decided; 26-50 only ordering or
        boundary choices; 51-75 some scope is deferred or reinterpreted; 76-100 the split changes what the issue
        asks for, or needs decisions only the owner can make. Write it as the line: SPLIT_RISK: <0-100>
        If the owner already agreed to split this issue (in the comments above), also write: SPLIT_APPROVED: yes
      - NEEDS_INFO: a decision only the owner can make, or missing requirements. Ask specific questions
        with the options you see and your recommendation. Do not guess on things that matter.
      - READY: write the plan with these sections:
        ## Goal — what will work when this is done, in one or two sentences.
        ## Acceptance criteria — a checklist that can be verified.
        ## Design — the approach, and why it fits the existing architecture. Alternatives you rejected, briefly.
        ## Changes — per module/file (existing paths, or marked NEW): what changes. Include signatures of
           new public types/functions.
        ## Implementation steps — ordered, each small enough to compile and test.
        ## Tests — the concrete test cases to add (unit/integration), including edge cases and failure paths.
        ## Documentation — what goes in the changelog / user guide.
        ## Risks & open points — what could go wrong, migrations, performance, security, compatibility.
        No new dependencies unless the issue asks for them. Be concrete; skip filler.

      Also score how risky it is to build this plan without a human checking it first (0-100):
      - 0-25: a local change, well covered by tests, easy to undo.
      - 26-50: several modules, or new behaviour users see; tests can cover it.
      - 51-75: persistence or migrations, concurrency, public APIs or file formats, or hard to test automatically.
      - 76-100: security or trust (authentication, signing, secrets, crypto), installing/updating/deleting
        software or user data, irreversible operations, privacy/legal, or the plan rests on assumptions
        you could not verify in the code.
      For READY, end the plan with a "## Risk" section explaining the score, then these two lines:
      RISK_SCORE: <0-100>
      RISK_REASON: <one line>

      End with exactly one line: PLAN_STATUS: READY | NEEDS_INFO | NOT_CODE | TOO_BIG
    routes:
      - if: "^PLAN_STATUS: READY\\s*$"
        goto: plan_review
      - if: "^PLAN_STATUS: TOO_BIG\\s*$"
        goto: split_gate
    on_success: send_back
    max_budget_usd: 8
  - id: plan_review
    type: claude
    agent: codex
    effort: high
    jump_only: true
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
    description: A second model checks the plan against the real code (skipped if Codex is unavailable)
    prompt: |-
      Review this implementation plan for the GitHub issue below, against the actual code in this
      repository. Do not change files. Check:
      - Does every file, class, function and module it mentions exist as described? Wrong assumptions?
      - Does it cover the whole issue and all acceptance criteria? Missing steps, migrations, wiring?
      - Does it fit the existing architecture and patterns, or is there a simpler way that fits better?
      - Are the tests enough (edge cases, failure paths)? Security, data loss, concurrency risks?
      Report only real problems, each with what is wrong and what the plan should say instead.

      {{steps.pull_ticket.output}}

      === PLAN ===
      {{steps.plan.output}}

      Also score how risky it is to build this plan without a human checking it first (0-100):
      - 0-25: a local change, well covered by tests, easy to undo.
      - 26-50: several modules, or new behaviour users see; tests can cover it.
      - 51-75: persistence or migrations, concurrency, public APIs or file formats, or hard to test automatically.
      - 76-100: security or trust (authentication, signing, secrets, crypto), installing/updating/deleting
        software or user data, irreversible operations, privacy/legal, or the plan rests on assumptions
        you could not verify in the code.
      Give your own score (not the plan's) as a line: RISK_SCORE: <0-100>

      End with exactly one line: VERDICT: APPROVE   or   VERDICT: CHANGES
    routes:
      - if: "^VERDICT: APPROVE\\s*$"
        goto: risk_gate
    on_success: revise_plan
    on_failure: risk_gate
  - id: revise_plan
    type: claude
    model: claude-opus-5-5
    effort: xhigh
    jump_only: true
    description: "Fresh session: check only the reviewer's points, then write the final plan (falls back to the draft on failure)"
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(git show*)
      - Bash(git grep*)
      - Bash(ls*)
    prompt: |-
      You are the lead architect for this repository. Below are a GitHub issue, the implementation plan
      you drafted for it, and a second reviewer's check of that plan against the code. Do NOT modify files.

      Check each review point in the code: open only the files needed to confirm or refute that point —
      the rest of the draft was already verified, do not re-investigate it. Adopt the points that are right
      and ignore the ones that are wrong. Then output the complete final plan (all sections, not just the
      changes), followed by a short "## Review notes" section listing which points you adopted and which you
      rejected, with one line why.
      Keep the "## Risk" section and the RISK_SCORE / RISK_REASON lines, updated if the review changed
      the picture (never lower the score just because the reviewer scored lower).

      {{steps.pull_ticket.output}}

      === YOUR DRAFT PLAN ===
      {{steps.plan.output}}

      === REVIEW ===
      {{steps.plan_review.output}}

      End with exactly one line: PLAN_STATUS: READY | NEEDS_INFO | NOT_CODE | TOO_BIG
    routes:
      - if: "^PLAN_STATUS: READY\\s*$"
        goto: risk_gate
      - if: "^PLAN_STATUS: TOO_BIG\\s*$"
        goto: split_gate
      - if: "^PLAN_STATUS: [A-Z_]+\\s*$"
        goto: send_back
    on_success: risk_gate
    on_failure: risk_gate
    max_budget_usd: 8
  - id: send_back
    type: shell
    jump_only: true
    description: Post why the issue can't be planned yet, then stop (resumes when someone replies)
    resume_from: pull_ticket
    run: |-
      out="${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}"
      status=$(printf '%s\n' "$out" | sed -n 's/^PLAN_STATUS: *\([A-Z_]*\).*/\1/p' | tail -1)
      case "$status" in
        NEEDS_INFO) head="needs more information before it can plan this issue:" ;;
        NOT_CODE) head="thinks this issue is not a coding task:" ;;
        TOO_BIG) head="thinks this issue is too big for one change and proposes splitting it:" ;;
        *) echo "planning failed: no PLAN_STATUS line"; exit 1 ;;
      esac
      { echo "$FACTORY_FIRST_PLANNER_QUESTIONS"; echo
        echo "🤖 **Spaghetti Code Foundry** $head"; echo
        printf '%s\n' "$out" | sed '/^PLAN_STATUS:/d'
        echo; echo "_${FACTORY_NEXT_PLANNER_QUESTIONS}_"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
    on_success: stop
  - id: split_gate
    type: shell
    jump_only: true
    description: "Low-risk split (or already agreed): create the issues; otherwise ask the owner"
    run: |-
      out="${FACTORY_OUT_FORCE_SPLIT:-${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}}"
      printf '%s\n' "$out" | grep -q "^### ISSUE [0-9]" || { echo "SPLIT: none (no parts in the answer)"; exit 0; }
      risk=$(printf '%s\n' "$out" | sed -n 's/^SPLIT_RISK: *\([0-9][0-9]*\).*/\1/p' | tail -1); risk=${risk:-100}
      limit=${FACTORY_VAR_AUTO_SPLIT_MAX_RISK:-50}; agreed=""; forced=""
      printf '%s\n' "$out" | grep -q "^SPLIT_APPROVED: *yes" && agreed=yes
      if [ -n "$FACTORY_VAR_REVIEW_PLAN_LABEL" ] && gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$FACTORY_VAR_REVIEW_PLAN_LABEL"; then forced=yes; fi
      if [ -n "$agreed" ]; then echo "The owner already agreed to the split — creating the issues."; echo "GATE: no"; exit 0; fi
      if [ "$risk" -le "$limit" ] && [ -z "$forced" ]; then echo "Split risk $risk/100 (≤ $limit) — creating the issues without asking."; echo "GATE: no"; exit 0; fi
      why="the split risk is $risk/100 (above $limit)"; [ -n "$forced" ] && why="the issue has the \`$FACTORY_VAR_REVIEW_PLAN_LABEL\` label"
      { echo "$FACTORY_FIRST_APPROVE_SPLIT"; echo
        echo "🤖 **Spaghetti Code Foundry** thinks this issue is too big for one change and proposes splitting it (**split risk: $risk/100**):"; echo
        printf '%s\n' "$out" | sed '/^PLAN_STATUS:/d; /^SPLIT_RISK:/d; /^SPLIT_APPROVED:/d'
        echo; echo "✋ **You decide** ($why)."
        echo; echo "_${FACTORY_NEXT_APPROVE_SPLIT}_"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID approval -->"; } | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file - >/dev/null
      echo "asked the owner: $why"; echo "GATE: yes"
    routes:
      - if: "^SPLIT: none"
        goto: send_back
      - if: "^GATE: yes\\s*$"
        goto: approve_split
    on_success: create_split
  - id: approve_split
    type: approval
    jump_only: true
    message: Split {{vars.github_repo}}#{{vars.issue}} into the proposed issues? (reply /approve or /reject on the issue)
    on_success: create_split
    on_failure: pull_ticket
  - id: create_split
    type: shell
    jump_only: true
    description: Create the parts as issues (in order, with Depends on and the build label), then close this issue
    run: printf '%s\n' "${FACTORY_OUT_FORCE_SPLIT:-${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}}" | "$FACTORY_TOOLS/create-split"
    on_success: end
  - id: risk_gate
    type: shell
    description: Post the plan with its risk score; above the threshold (or with the review label) a human approves first
    run: |-
      out="$FACTORY_OUT_PLAN"; notes=""
      if printf '%s\n' "$FACTORY_OUT_REVISE_PLAN" | grep -q "^PLAN_STATUS: READY"; then out="$FACTORY_OUT_REVISE_PLAN"
      elif [ -n "$FACTORY_OUT_PLAN_REVIEW" ]; then notes="$FACTORY_OUT_PLAN_REVIEW"; fi
      score() { printf '%s\n' "$1" | sed -n 's/^RISK_SCORE: *\([0-9][0-9]*\).*/\1/p' | tail -1; }
      p=$(score "$out"); [ -n "$p" ] || p=$(score "$FACTORY_OUT_PLAN"); c=$(score "$FACTORY_OUT_PLAN_REVIEW")
      reason=$(printf '%s\n' "$out" | sed -n 's/^RISK_REASON: *//p' | tail -1)
      if [ -z "$p" ]; then risk=100; reason="the plan has no risk score"; else risk=$p; fi
      if [ -n "$c" ] && [ "$c" -gt "$risk" ]; then risk=$c; reason="${reason:+$reason — }Codex scored it $c"; fi
      [ "$risk" -gt 100 ] && risk=100
      limit=${FACTORY_VAR_RISK_THRESHOLD:-75}; gate=no; why=""
      if [ "$risk" -gt "$limit" ]; then gate=yes; why="the risk score is above $limit"; fi
      if [ -n "$FACTORY_VAR_REVIEW_PLAN_LABEL" ] && gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$FACTORY_VAR_REVIEW_PLAN_LABEL"; then
        gate=yes; why="${why:+$why, and }the issue has the \`$FACTORY_VAR_REVIEW_PLAN_LABEL\` label"
      fi
      plan=$(printf '%s\n' "$out" | sed '/^PLAN_STATUS:/d; /^RISK_SCORE:/d; /^RISK_REASON:/d')
      reviewed=""; [ -n "$FACTORY_OUT_PLAN_REVIEW" ] && reviewed=" (checked against the code by Codex)"
      [ -n "$notes" ] && reviewed=" (draft — the revision did not finish; Codex's review notes are below)"
      printf '%s\n' "$FACTORY_OUT_REVISE_GATE" | grep -q "^SKIPPED" && reviewed=" (checked against the code by Codex — low risk, so the coder works in Codex's notes below)"
      if [ "$gate" = yes ]; then first="$FACTORY_FIRST_APPROVE_PLAN"; else first="$FACTORY_FIRST_NOTHING"; fi
      { echo "$first"; echo
        echo "🤖 **Spaghetti Code Foundry plan**$reviewed"; echo; echo "**Risk: $risk/100**${reason:+ — $reason}"; echo
        printf '%s\n' "$plan"
        if [ -n "$notes" ]; then echo; echo "## Codex review notes (not yet worked in)"; echo; printf '%s\n' "$notes" | sed '/^VERDICT:/d; /^RISK_SCORE:/d'; fi
        echo
        if [ "$gate" = yes ]; then
          echo "✋ **A human decides before coding starts:** $why."
          echo; echo "_${FACTORY_NEXT_APPROVE_PLAN}_"
          echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID approval -->"
        else
          echo "_Coding starts now; the result goes into the Foundry pull request, where you review it._"
          echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID plan -->"
        fi; } | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file - >/dev/null
      printf '%s\n' "$plan"
      [ -n "$notes" ] && { echo; echo "## Review notes to work in"; printf '%s\n' "$notes" | sed '/^VERDICT:/d; /^RISK_SCORE:/d'; }
      echo; echo "RISK: $risk"; echo "GATE: $gate"
    routes:
      - if: "^GATE: yes\\s*$"
        goto: approve_plan
    on_success: implement
  - id: approve_plan
    type: approval
    jump_only: true
    message: Approve the plan for {{vars.github_repo}}#{{vars.issue}} (reply /approve or /reject on the issue)
    on_success: implement
    on_failure: pull_ticket
  - id: implement
    type: claude
    prompt: |-
      Implement GitHub issue below in this repository.

      {{steps.pull_ticket.output}}

      Follow this plan (comments from people on the issue override it):

      {{steps.risk_gate.output}}

      Notes from the person who approved the plan, if any: {{steps.approve_plan.output}}

      Follow the repository's CLAUDE.md conventions.
      - Add or update tests for everything you change.
      - Do not add new dependencies. Do not change: {{vars.forbidden_paths}}
      - Do not write documentation yet; that is a separate step.
      - Do not commit.
      - You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      Things learned from earlier runs in this repo:
      {{learnings}}

      Finish with a short summary of what you changed (files and why).
  - id: guard
    type: shell
    description: No forbidden paths, no disabled or deleted tests, something changed
    run: |-
      git add -A -N >/dev/null 2>&1 || true
      changed=$(git diff HEAD --name-only)
      [ -n "$changed" ] || { echo "no changes were made"; exit 1; }
      bad=0
      for p in $FACTORY_VAR_FORBIDDEN_PATHS; do
        hits=$(printf '%s\n' "$changed" | grep "^$p" || true)
        [ -n "$hits" ] && { echo "changes in forbidden path $p:"; printf '%s\n' "$hits"; bad=1; }
      done
      added=$(git diff HEAD -U0 | grep '^+' | grep -v '^+++' || true)
      removed=$(git diff HEAD -U0 | grep '^-' | grep -v '^---' || true)
      skips=$(printf '%s\n' "$added" | grep -E '@Disabled|@Ignore\b|\.skip\(|\bxit\(|\bxdescribe\(|@pytest\.mark\.skip|t\.Skip\(' || true)
      [ -n "$skips" ] && { echo "tests were disabled or skipped:"; printf '%s\n' "$skips"; bad=1; }
      pat='@Test\b|@ParameterizedTest|\bit\(|\btest\(|def test_'
      rt=$(printf '%s\n' "$removed" | grep -Ec "$pat" || true); at=$(printf '%s\n' "$added" | grep -Ec "$pat" || true)
      [ "$rt" -gt "$at" ] && { echo "tests were removed ($rt removed, $at added)"; bad=1; }
      [ "$bad" = 0 ] && echo "guard ok: $(printf '%s\n' "$changed" | wc -l | tr -d " ") files changed"
      exit "$bad"
    on_failure: fix_guard
  - id: fix_guard
    type: claude
    resume: implement
    jump_only: true
    max_visits: 2
    prompt: |-
      Your changes broke a rule of this factory. Fix that (restore removed/disabled tests, revert changes in forbidden paths, or make the missing change):

      {{steps.guard.output}}
    on_success: guard
  - id: run_tests
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: fix_tests
  - id: fix_tests
    type: claude
    resume: implement
    jump_only: true
    max_visits: 3
    prompt: |-
      The tests fail. Fix the code so they pass. Never delete, disable or weaken tests to make them pass;
      change a test only if the test itself is wrong, and say so.
      You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      {{steps.run_tests.output}}
    on_success: run_tests
  - id: review_1
    type: claude
    agent: codex
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
    prompt: |-
      Code review, round 1 of 2. Another AI implemented the GitHub issue below; its changes are
      uncommitted in this repository (run `git status` and `git diff HEAD`). Review them strictly for
      correctness, edge cases, security, error handling, test coverage and fit with the existing code.
      Report only real problems, each with file, line, problem and the fix. No style nitpicks.
      Start each problem with [high] (wrong behaviour, data loss, security, a crash), [medium] or [low].

      {{steps.pull_ticket.output}}

      End with these two lines: SEVERITY: high | medium | low | none   (the most serious problem)
      VERDICT: APPROVE   or   VERDICT: CHANGES
    routes:
      - if: "^VERDICT: APPROVE\\s*$"
        goto: docs
  - id: address_review_1
    type: claude
    resume: implement
    prompt: |-
      A reviewer (Codex) looked at your changes. Fix every point you agree with. For points you
      disagree with, explain why in one line each. Keep tests passing; don't write docs yet.

      {{steps.review_1.output}}
  - id: run_tests_1
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: fix_tests_1
  - id: fix_tests_1
    type: claude
    resume: implement
    jump_only: true
    max_visits: 3
    prompt: |-
      The tests fail. Fix the code so they pass. Never delete, disable or weaken tests to make them pass;
      change a test only if the test itself is wrong, and say so.
      You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      {{steps.run_tests_1.output}}
    on_success: run_tests_1
  - id: review_2
    type: claude
    agent: codex
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
    prompt: |-
      Code review, round 2 of 2. Another AI implemented the GitHub issue below; its changes are
      uncommitted in this repository (run `git status` and `git diff HEAD`). Review them strictly for
      correctness, edge cases, security, error handling, test coverage and fit with the existing code.
      Report only real problems, each with file, line, problem and the fix. No style nitpicks.
      Start each problem with [high] (wrong behaviour, data loss, security, a crash), [medium] or [low].

      {{steps.pull_ticket.output}}

      End with these two lines: SEVERITY: high | medium | low | none   (the most serious problem)
      VERDICT: APPROVE   or   VERDICT: CHANGES
    routes:
      - if: "^VERDICT: APPROVE\\s*$"
        goto: docs
  - id: address_review_2
    type: claude
    resume: implement
    prompt: |-
      A reviewer (Codex) looked at your changes. Fix every point you agree with. For points you
      disagree with, explain why in one line each. Keep tests passing; don't write docs yet.

      {{steps.review_2.output}}
  - id: run_tests_2
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: fix_tests_2
  - id: fix_tests_2
    type: claude
    resume: implement
    jump_only: true
    max_visits: 3
    prompt: |-
      The tests fail. Fix the code so they pass. Never delete, disable or weaken tests to make them pass;
      change a test only if the test itself is wrong, and say so.
      You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      {{steps.run_tests_2.output}}
    on_success: run_tests_2
  - id: docs
    type: claude
    resume: implement
    prompt: |-
      Now document the change you made for this issue, following the repository's documentation rules
      (CLAUDE.md). If there are none: update README/docs where behaviour changed, and add doc comments
      to new public APIs. Required files that must be updated: {{vars.docs_required}}

      {{steps.pull_ticket.output}}

      What was implemented:
      {{steps.implement.output}}

      {{steps.final_guard.output}}
    max_visits: 2
  - id: final_guard
    type: shell
    description: "Same checks as guard, plus: required docs were updated"
    run: |-
      git add -A -N >/dev/null 2>&1 || true
      changed=$(git diff HEAD --name-only)
      [ -n "$changed" ] || { echo "no changes were made"; exit 1; }
      bad=0
      for p in $FACTORY_VAR_FORBIDDEN_PATHS; do
        hits=$(printf '%s\n' "$changed" | grep "^$p" || true)
        [ -n "$hits" ] && { echo "changes in forbidden path $p:"; printf '%s\n' "$hits"; bad=1; }
      done
      added=$(git diff HEAD -U0 | grep '^+' | grep -v '^+++' || true)
      removed=$(git diff HEAD -U0 | grep '^-' | grep -v '^---' || true)
      skips=$(printf '%s\n' "$added" | grep -E '@Disabled|@Ignore\b|\.skip\(|\bxit\(|\bxdescribe\(|@pytest\.mark\.skip|t\.Skip\(' || true)
      [ -n "$skips" ] && { echo "tests were disabled or skipped:"; printf '%s\n' "$skips"; bad=1; }
      pat='@Test\b|@ParameterizedTest|\bit\(|\btest\(|def test_'
      rt=$(printf '%s\n' "$removed" | grep -Ec "$pat" || true); at=$(printf '%s\n' "$added" | grep -Ec "$pat" || true)
      [ "$rt" -gt "$at" ] && { echo "tests were removed ($rt removed, $at added)"; bad=1; }
      for f in $FACTORY_VAR_DOCS_REQUIRED; do
        printf '%s\n' "$changed" | grep -qx "$f" || { echo "documentation not updated: $f"; bad=1; }
      done
      [ "$bad" = 0 ] && echo "guard ok: $(printf '%s\n' "$changed" | wc -l | tr -d " ") files changed"
      exit "$bad"
    on_failure: docs
  - id: commit
    type: shell
    run: |-
      git add -A
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null)
      git commit -q -m "Resolve #$FACTORY_VAR_ISSUE: $title" -m "Written by Claude, reviewed by Codex, tests passing. Spaghetti Code Foundry run $FACTORY_RUN_ID"
      git log --oneline -1
  - id: push
    type: shell
    run: |-
      branch=$(git branch --show-current)
      if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then git pull -q --rebase origin "$branch"; fi
      git push -q -u origin HEAD && echo "pushed $branch"
  - id: open_pr
    type: shell
    description: Open the factory pull request, or add this issue to the open one
    run: '"$FACTORY_TOOLS/daily-branch" ensure-pr "$(git branch --show-current)"'
  - id: report
    type: shell
    run: |-
      branch=$(git branch --show-current); sha=$(git rev-parse HEAD)
      verdict() { printf '%s\n' "$1" | sed -n 's/^VERDICT: *//p' | tail -1; }
      { echo "$FACTORY_FIRST_SHIPS"; echo
        echo "🤖 **Spaghetti Code Foundry** implemented this on branch \`$branch\` (commit https://github.com/$FACTORY_VAR_GITHUB_REPO/commit/$sha)."
        echo; echo "### What was done"; printf '%s\n' "$FACTORY_OUT_IMPLEMENT"
        echo; echo "### Review (Codex)"
        echo "- round 1: $(verdict "$FACTORY_OUT_REVIEW_1")"
        [ -n "$FACTORY_OUT_REVIEW_2" ] && echo "- round 2: $(verdict "$FACTORY_OUT_REVIEW_2")"
        echo; echo "### Tests"; echo '```'; cat "{{run.dir}}/last-tests.txt"; echo '```'
        echo; echo "### Files changed"; echo '```'; git show --stat --format= HEAD | tail -40; echo '```'
        echo; echo "_It is in the release pull request: $FACTORY_OUT_OPEN_PR — merge it whenever you like._"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
    on_success: end
  - id: baseline_failed
    type: shell
    jump_only: true
    run: echo "The tests already fail on $(git branch --show-current) before any change — not starting."; tail -40 "{{run.dir}}/tests.log"; exit 1
