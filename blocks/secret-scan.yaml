name: Scan for secrets
category: Checks
description: Fails if the run's commits add API keys, tokens, private keys or .env files. (Pushes are also scanned automatically unless secret_scan is off in Settings.)
steps:
  - id: secret_scan
    type: shell
    run: |
      if [ -n "$FACTORY_BASE_SHA" ]; then "$FACTORY_TOOLS/secret-scan" "$FACTORY_BASE_SHA..HEAD"
      else "$FACTORY_TOOLS/secret-scan"; fi
