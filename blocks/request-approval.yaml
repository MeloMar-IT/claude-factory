name: Ask for approval on the ticket
category: GitHub
description: "Asks on the issue for a go-ahead and pauses the run until someone answers /approve or /reject there (the watcher picks it up), or decides in the UI."
vars:
  github_repo: owner/repo
  issue: ""
steps:
  - id: request_approval
    type: shell
    run: |
      {
        echo "$FACTORY_FIRST_APPROVAL"; echo
        echo "✋ **Spaghetti Code Foundry is ready to push** branch \`$(git branch --show-current)\`:"
        echo; git log --oneline origin/HEAD..HEAD 2>/dev/null
        echo; echo '```'; git diff --stat origin/HEAD 2>/dev/null | tail -20; echo '```'
        echo; echo "_${FACTORY_NEXT_APPROVAL}_"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID approval -->"
      } | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -

  - id: approve
    type: approval
    message: "Push the changes for {{vars.github_repo}}#{{vars.issue}}?"
    on_failure: stop
