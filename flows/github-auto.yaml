# ─── GitHub ticket → triage → the right amount of process ──────────────
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run github-auto --var github_repo=owner/repo --var issue=42
# 
# triage ─┬─ SMALL      → code → tests → review → PR → CI
#         ├─ FEATURE    → plan → post plan → code → …
#         ├─ SPLIT      → create sub-issues (labelled claude-factory if auto_subtasks=yes) → end
#         └─ NEEDS_INFO → ask on the ticket → stop (resumes when answered)
# ────────────────────────────────────────────────────────────────────────
name: github-auto
description: Triage the ticket, then small fix, full feature, split into sub-issues, or ask questions
workspace: empty
one_per_repo: true
defaults:
  model: claude-sonnet-5-5
  timeout_sec: 1800
limits:
  max_cost_usd: 20
vars:
  github_repo: owner/repo
  issue: ""
  test_cmd: auto
  auto_subtasks: no
steps:
  - id: check_repo
    type: shell
    description: Verify the repo exists and show your permission
    run: |
      gh repo view "$FACTORY_VAR_GITHUB_REPO" --json nameWithOwner,defaultBranchRef,viewerPermission \
        --jq '"repo: \(.nameWithOwner)\ndefault branch: \(.defaultBranchRef.name)\nyour permission: \(.viewerPermission)"'
  - id: pull_ticket
    type: shell
    description: Read the GitHub issue as plain text
    run: |
      case "$FACTORY_VAR_ISSUE" in ''|*[!0-9]*) echo "set the 'issue' variable to an issue number (got '$FACTORY_VAR_ISSUE')"; exit 1;; esac
      gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json number,title,body,url,labels,comments --jq '
        "# #\(.number): \(.title)\n\(.url)\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)\n"
        + ([.comments[] | "\n--- comment by \(.author.login):\n\(.body)"] | join("\n"))'
  - id: pull_repo
    type: shell
    description: Clone (or fast-forward) and create a factory/ branch
    run: |
      # Idempotent, so a resumed run can pass through here again.
      if [ -d .git ]; then git fetch -q origin; else gh repo clone "$FACTORY_VAR_GITHUB_REPO" . -- -q; fi
      branch="factory/${FACTORY_VAR_ISSUE:+issue-$FACTORY_VAR_ISSUE-}$FACTORY_RUN_ID"
      git checkout -q -B "$branch" origin/HEAD
      echo "branch: $branch"
      git log --oneline -1
  - id: triage
    type: claude
    model: claude-sonnet-5-5
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(ls*)
    prompt: |
      You triage tickets for an automated coding pipeline. Look at the codebase just enough
      to judge the ticket below. Do NOT modify files.

      {{steps.pull_ticket.output}}
      {{task}}

      Known lessons for this repo:
      {{learnings}}

      Decide one route and end your answer with exactly one of these lines:
      ROUTE: SMALL        — a clear, local change (a few files); no plan needed
      ROUTE: FEATURE      — clear but bigger; needs a plan first
      ROUTE: SPLIT        — too big for one change; list 2-6 independent sub-tasks above the
                            route line, one per line as: SUBTASK: <title> :: <one-paragraph description>
      ROUTE: NEEDS_INFO   — critical information is missing; list the specific questions above

      Before the route line, give a two-sentence justification.
    fail_if: "^ROUTE: (?!SMALL|FEATURE|SPLIT|NEEDS_INFO)"
    routes:
      - if: "^ROUTE: NEEDS_INFO"
        goto: ask_for_info
      - if: "^ROUTE: SPLIT"
        goto: split_ticket
      - if: "^ROUTE: SMALL"
        goto: implement
  - id: split_ticket
    type: shell
    jump_only: true
    description: Create one GitHub issue per SUBTASK line and link them from the ticket
    run: |
      R="$FACTORY_VAR_GITHUB_REPO"; N="$FACTORY_VAR_ISSUE"
      label=""; [ "$FACTORY_VAR_AUTO_SUBTASKS" = yes ] && label="claude-factory"
      created=""
      printf '%s\n' "$FACTORY_OUT_TRIAGE" | grep '^SUBTASK:' > subtasks.txt || { echo "no SUBTASK lines"; exit 1; }
      while IFS= read -r line; do
        rest=${line#SUBTASK: }; title=${rest%% :: *}; desc=${rest#* :: }
        body=$(printf 'Part of #%s\n\n%s\n\n<!-- claude-factory run=%s -->\n' "$N" "$desc" "$FACTORY_RUN_ID")
        url=$(gh issue create --repo "$R" --title "$title" --body "$body" ${label:+--label "$label"})
        created="$created
      - $url"
      done < subtasks.txt
      rm -f subtasks.txt
      { echo "🤖 **claude-factory** split this ticket into smaller ones:"; printf '%s\n' "$created"
        [ -n "$label" ] && echo && echo "They are labelled \`claude-factory\` and will be picked up automatically."
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$N" --repo "$R" --body-file -
    on_success: end
  - id: plan
    type: claude
    model: claude-opus-5-5
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(ls*)
    prompt: |
      You are the architect. Read the codebase and plan the work for the ticket below.
      Do NOT modify any files.

      Ticket:
      {{steps.pull_ticket.output}}

      Extra instructions: {{task}}

      If the ticket is clear enough, write a concise, concrete plan (files to touch,
      approach, tests to add), then end with exactly this line:
      PLAN_STATUS: READY

      If critical information is missing, do not guess. List the specific questions
      that must be answered first, then end with exactly this line:
      PLAN_STATUS: NEEDS_INFO
    pass_if: "^PLAN_STATUS: READY\\s*$"
    on_failure: ask_for_info
  - id: ask_for_info
    type: shell
    jump_only: true
    description: Post Claude's questions on the ticket, then stop the run
    run: |
      # Questions come from the plan step, or from triage when it ran without planning.
      out="${FACTORY_OUT_PLAN:-$FACTORY_OUT_TRIAGE}"
      printf '%s\n' "$out" | grep -Eq '^(PLAN_STATUS|ROUTE): NEEDS_INFO' || { echo "planning failed (no questions to ask)"; exit 1; }
      { echo "🤖 **claude-factory** needs more information before it can work on this ticket:"; echo
        printf '%s\n' "$out" | sed -E '/^(PLAN_STATUS|ROUTE):/d'
        echo; echo "_Reply on this issue; claude-factory continues once you answer._"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
    on_success: stop
    resume_from: pull_ticket
  - id: push_plan
    type: shell
    run: |
      { echo "🤖 **claude-factory plan**"; echo
        printf '%s\n' "$FACTORY_OUT_PLAN" | sed '/^PLAN_STATUS:/d'
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
  - id: implement
    type: claude
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git status*)
      - Bash(git diff*)
    prompt: |
      Implement the work described below. Keep changes focused and add or update tests.

      Ticket:
      {{steps.pull_ticket.output}}

      Plan:
      {{steps.plan.output}}

      Extra instructions: {{task}}

      When you are done, summarise what you changed in a few bullet points.
  - id: run_tests
    type: shell
    description: "test_cmd: a command, or auto to detect it (npm/pnpm/yarn, pytest, go, cargo, gradle, maven, make)"
    sandbox: true
    run: |
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "⚠ no test command found (set var test_cmd); skipping tests"; exit 0; fi
      echo "\$ $cmd"
      sh -c "$cmd"
    on_failure: fix_tests
  - id: fix_tests
    type: claude
    jump_only: true
    max_visits: 3
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
    prompt: |
      The tests failed. Fix the code so they pass (change tests only if they are wrong).

      Test output (tail):
      {{steps.run_tests.output}}
    on_success: run_tests
  - id: review
    type: claude
    model: claude-opus-5-5
    max_visits: 3
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git diff*)
      - Bash(git status*)
      - Bash(git log*)
    prompt: |
      You are a strict senior code reviewer. Review the uncommitted changes
      (`git status`, `git diff`, `git diff --cached`) for this work:

      {{steps.pull_ticket.output}}
      {{task}}

      Check correctness, edge cases, security, readability and test coverage.
      Be specific: file, line, problem, fix. End your answer with exactly one line:
      VERDICT: APPROVE   or   VERDICT: CHANGES
    pass_if: "^VERDICT: APPROVE\\s*$"
    on_failure: address_review
  - id: address_review
    type: claude
    jump_only: true
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
    prompt: |
      A reviewer requested changes. Address every point:

      {{steps.review.output}}
    on_success: run_tests
  - id: commit
    type: shell
    run: |
      git add -A
      if git diff --cached --quiet; then echo "nothing to commit"; exit 1; fi
      if [ -n "$FACTORY_VAR_ISSUE" ]; then msg="Resolve #$FACTORY_VAR_ISSUE"; else msg="factory: $(printf '%s' "$FACTORY_TASK" | head -1)"; fi
      git commit -q -m "$msg" -m "Automated by claude-factory (run $FACTORY_RUN_ID)"
      git log --oneline -1
  - id: push
    type: shell
    run: |
      git push -q -u origin HEAD
      echo "pushed $(git branch --show-current)"
  - id: open_pr
    type: shell
    run: |
      branch=$(git branch --show-current)
      existing=$(gh pr view "$branch" --repo "$FACTORY_VAR_GITHUB_REPO" --json url -q .url 2>/dev/null || true)
      if [ -n "$existing" ]; then echo "$existing"; exit 0; fi
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null || echo "$FACTORY_TASK")
      {
        [ -n "$FACTORY_VAR_ISSUE" ] && { echo "Closes #$FACTORY_VAR_ISSUE"; echo; }
        echo "### Changes"
        printf '%s\n' "$FACTORY_OUT_IMPLEMENT"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"
      } | gh pr create --repo "$FACTORY_VAR_GITHUB_REPO" --head "$branch" --title "${FACTORY_VAR_ISSUE:+#$FACTORY_VAR_ISSUE: }$title" --body-file -
  - id: wait_ci
    type: shell
    timeout_sec: 3600
    run: |
      branch=$(git branch --show-current)
      sleep "${FACTORY_VAR_CI_SETTLE_SEC:-15}"   # let CI register the new commit
      out=$(gh pr checks "$branch" --repo "$FACTORY_VAR_GITHUB_REPO" --watch --fail-fast --interval 20 2>&1); code=$?
      printf '%s\n' "$out"
      if printf '%s' "$out" | grep -qi "no checks reported"; then echo "no CI checks configured"; exit 0; fi
      if [ "$code" -ne 0 ]; then
        echo; echo "=== failed job logs (tail) ==="
        id=$(gh run list --repo "$FACTORY_VAR_GITHUB_REPO" --branch "$branch" --status failure --limit 1 --json databaseId -q '.[0].databaseId')
        [ -n "$id" ] && gh run view "$id" --repo "$FACTORY_VAR_GITHUB_REPO" --log-failed 2>&1 | tail -150
      fi
      exit "$code"
    on_failure: fix_ci
  - id: fix_ci
    type: claude
    jump_only: true
    max_visits: 3
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
      - Bash(git log*)
    prompt: |
      CI failed on this branch. Find the cause in the output below and fix the code.
      Do not disable or skip checks.

      {{steps.wait_ci.output}}
    on_success: push_ci_fix
  - id: push_ci_fix
    type: shell
    jump_only: true
    run: |
      git add -A
      git diff --cached --quiet && { echo "fix_ci changed nothing"; exit 1; }
      git commit -q -m "Fix CI" -m "Automated by claude-factory (run $FACTORY_RUN_ID)"
      git push -q && git log --oneline -1
    on_success: wait_ci
  - id: push_result
    type: shell
    run: |
      branch=$(git branch --show-current)
      {
        echo "✅ **claude-factory finished this ticket**"
        echo
        pr=$(gh pr view "$branch" --repo "$FACTORY_VAR_GITHUB_REPO" --json url -q .url 2>/dev/null || true)
        if [ -n "$pr" ]; then echo "Pull request: $pr"
        else echo "Branch: [\`$branch\`](https://github.com/$FACTORY_VAR_GITHUB_REPO/compare/$branch?expand=1) — open a pull request from there."; fi
        echo
        echo "### Changes"
        printf '%s\n' "$FACTORY_OUT_IMPLEMENT"
        echo
        echo "### Commits"
        git log --oneline origin/HEAD..HEAD 2>/dev/null || git log --oneline -3
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"
      } | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
  - id: learn
    type: claude
    model: haiku
    permission_mode: dontAsk
    allowed_tools: []
    prompt: |
      This is the step history of an automated coding run on this repository:

      {{run.history}}

      Existing lessons for this repo:
      {{learnings}}

      If steps failed or needed fix loops, write 1-3 short, specific, reusable lessons that
      would help future runs on this repo avoid that (e.g. "tests need `npm run build` first").
      Do not repeat existing lessons. If there is nothing new worth remembering, reply exactly: NONE
  - id: save_learnings
    type: shell
    run: |
      out=$(printf '%s' "$FACTORY_OUT_LEARN" | sed '/^[[:space:]]*$/d')
      [ "$out" = "NONE" ] || [ -z "$out" ] && { echo "nothing new"; exit 0; }
      mkdir -p "$(dirname "$FACTORY_LEARNINGS_FILE")"
      { echo "<!-- $(date +%F) run $FACTORY_RUN_ID -->"; printf '%s\n' "$out"; } >> "$FACTORY_LEARNINGS_FILE"
      echo "saved to $FACTORY_LEARNINGS_FILE"
