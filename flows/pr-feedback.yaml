# ─── Address review comments on a pull request ─────────────────────────
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run pr-feedback --var github_repo=owner/repo --var pr=17
# (the watcher runs this automatically for new comments on factory PRs)
# ────────────────────────────────────────────────────────────────────────
name: pr-feedback
description: Check out a PR, address its review comments, test, push, reply on the PR
workspace: empty
one_per_repo: true
defaults:
  model: claude-sonnet-5-5
  timeout_sec: 1800
limits:
  max_cost_usd: 10
vars:
  github_repo: owner/repo
  pr: ""
  test_cmd: auto
steps:
  - id: checkout_pr
    type: shell
    run: |
      case "$FACTORY_VAR_PR" in ''|*[!0-9]*) echo "set the 'pr' variable to a PR number"; exit 1;; esac
      [ -d .git ] || gh repo clone "$FACTORY_VAR_GITHUB_REPO" . -- -q
      gh pr checkout "$FACTORY_VAR_PR" --repo "$FACTORY_VAR_GITHUB_REPO" --force
      git branch --show-current
  - id: pr_comments
    type: shell
    run: |
      R="$FACTORY_VAR_GITHUB_REPO"; N="$FACTORY_VAR_PR"
      gh pr view "$N" --repo "$R" --json number,title,body -q '"# PR #\(.number // "") \(.title)\n\(.body)\n"' 2>/dev/null || true
      echo "## Line comments"
      gh api "repos/$R/pulls/$N/comments" --jq '.[] | select(.body | (contains("claude-factory") or contains("spaghetti-code-foundry")) | not) | "--- \(.user.login) on \(.path):\(.line // .original_line):\n\(.body)\n"'
      echo "## Reviews and comments"
      gh pr view "$N" --repo "$R" --json reviews,comments --jq '
        (.reviews[] | select(.body != "") | "--- review by \(.author.login) (\(.state)):\n\(.body)\n"),
        (.comments[] | select(.body | (contains("claude-factory") or contains("spaghetti-code-foundry")) | not) | "--- \(.author.login):\n\(.body)\n")'
  - id: address_comments
    type: claude
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
      - Bash(git log*)
    prompt: |
      Address the review feedback on this pull request. Handle every actionable comment;
      if you disagree with one, explain why instead of changing the code.
      Ignore comments that were already addressed by later commits (see `git log`).

      {{steps.pr_comments.output}}

      Finish with a short summary per comment of what you did.
  - id: run_tests
    type: shell
    description: "test_cmd: a command, or auto to detect it (npm/pnpm/yarn, pytest, go, cargo, gradle, maven, make)"
    sandbox: true
    run: |
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "⚠ no test command found (set var test_cmd); skipping tests"; exit 0; fi
      echo "\$ $cmd"
      sh -c "$cmd"
    on_failure: fix_tests
  - id: fix_tests
    type: claude
    jump_only: true
    max_visits: 3
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
    prompt: |
      The tests failed. Fix the code so they pass (change tests only if they are wrong).

      Test output (tail):
      {{steps.run_tests.output}}
    on_success: run_tests
  - id: push_changes
    type: shell
    run: |-
      git add -A
      git diff --cached --quiet && { echo "no code changes"; exit 0; }
      git commit -q -m "Address review comments" -m "Automated by Spaghetti Code Foundry (run $FACTORY_RUN_ID)"
      git push -q && git log --oneline -1
  - id: reply
    type: shell
    run: |-
      { echo "🤖 **Spaghetti Code Foundry** went through the review comments:"; echo
        printf '%s\n' "$FACTORY_OUT_ADDRESS_COMMENTS"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh pr comment "$FACTORY_VAR_PR" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
