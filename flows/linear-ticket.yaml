# ─── Linear ticket → code in this repo → pushed branch ─────────────────
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run linear-ticket --var ticket=ENG-123   (from inside your repo)
# needs env LINEAR_API_KEY
# ────────────────────────────────────────────────────────────────────────
name: linear-ticket
description: Linear ticket → plan (posted to Linear) → code → tests → review → commit → push → result on Linear
workspace: worktree
one_per_repo: true
defaults:
  model: claude-sonnet-5-5
  timeout_sec: 1800
limits:
  max_cost_usd: 15
vars:
  ticket: ""
  test_cmd: auto
steps:
  - id: pull_ticket
    type: shell
    run: |
      case "$FACTORY_VAR_TICKET" in *[!A-Za-z0-9-]*|'') echo "set var ticket to a Linear id like ENG-123"; exit 1;; esac
      : "${LINEAR_API_KEY:?set LINEAR_API_KEY}"
      jq -n --arg id "$FACTORY_VAR_TICKET" '{query: "query($id: String!) { issue(id: $id) { identifier title description url state { name } comments { nodes { body user { name } } } } }", variables: {id: $id}}' \
      | curl -sfS -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" --data @- "${LINEAR_API_URL:-https://api.linear.app/graphql}" \
      | jq -re '.data.issue | "# \(.identifier): \(.title)\n\(.url)\nState: \(.state.name)\n\n\(.description // "")\n"
          + ([.comments.nodes[] | "\n--- comment by \(.user.name // "someone"):\n\(.body)"] | join("\n"))'
  - id: plan
    type: claude
    model: claude-opus-5-5
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(ls*)
    prompt: |
      You are the architect. Read the codebase and plan the work for the ticket below.
      Do NOT modify any files.

      Ticket:
      {{steps.pull_ticket.output}}

      Extra instructions: {{task}}

      If the ticket is clear enough, write a concise, concrete plan (files to touch,
      approach, tests to add), then end with exactly this line:
      PLAN_STATUS: READY

      If critical information is missing, do not guess. List the specific questions
      that must be answered first, then end with exactly this line:
      PLAN_STATUS: NEEDS_INFO
    pass_if: "^PLAN_STATUS: READY\\s*$"
    on_failure: ask_for_info
  - id: ask_for_info
    type: shell
    jump_only: true
    description: Show Claude's questions and stop; answer on the ticket, then resume the run
    run: |-
      printf '%s
      ' "$FACTORY_OUT_PLAN" | sed -E '/^(PLAN_STATUS|ROUTE):/d'
    on_success: stop
    resume_from: pull_ticket
  - id: linear_push_plan
    type: shell
    run: |
      case "$FACTORY_VAR_TICKET" in *[!A-Za-z0-9-]*|'') echo "set var ticket to an issue key like PROJ-123"; exit 1;; esac
      text=$(printf "🤖 claude-factory plan:\n\n%s\n" "$(printf "%s\n" "$FACTORY_OUT_PLAN" | sed -E "/^(PLAN_STATUS|ROUTE):/d")")
      api="${LINEAR_API_URL:-https://api.linear.app/graphql}"
      # commentCreate needs the issue's UUID, so look it up first.
      uuid=$(jq -n --arg id "$FACTORY_VAR_TICKET" '{query: "query($id: String!) { issue(id: $id) { id } }", variables: {id: $id}}' \
        | curl -sfS -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" --data @- "$api" | jq -re '.data.issue.id')
      jq -n --arg issueId "$uuid" --arg body "$text" '{query: "mutation($issueId: String!, $body: String!) { commentCreate(input: {issueId: $issueId, body: $body}) { success } }", variables: {issueId: $issueId, body: $body}}' \
        | curl -sfS -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" --data @- "$api" | jq -re '"commented: \(.data.commentCreate.success)"'
  - id: implement
    type: claude
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git status*)
      - Bash(git diff*)
    prompt: |
      Implement the work described below. Keep changes focused and add or update tests.

      Ticket:
      {{steps.pull_ticket.output}}

      Plan:
      {{steps.plan.output}}

      Extra instructions: {{task}}

      When you are done, summarise what you changed in a few bullet points.
  - id: run_tests
    type: shell
    description: "test_cmd: a command, or auto to detect it (npm/pnpm/yarn, pytest, go, cargo, gradle, maven, make)"
    sandbox: true
    run: |
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "⚠ no test command found (set var test_cmd); skipping tests"; exit 0; fi
      echo "\$ $cmd"
      sh -c "$cmd"
    on_failure: fix_tests
  - id: fix_tests
    type: claude
    jump_only: true
    max_visits: 3
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
    prompt: |
      The tests failed. Fix the code so they pass (change tests only if they are wrong).

      Test output (tail):
      {{steps.run_tests.output}}
    on_success: run_tests
  - id: review
    type: claude
    model: claude-opus-5-5
    max_visits: 3
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git diff*)
      - Bash(git status*)
      - Bash(git log*)
    prompt: |
      You are a strict senior code reviewer. Review the uncommitted changes
      (`git status`, `git diff`, `git diff --cached`) for this work:

      {{steps.pull_ticket.output}}
      {{task}}

      Check correctness, edge cases, security, readability and test coverage.
      Be specific: file, line, problem, fix. End your answer with exactly one line:
      VERDICT: APPROVE   or   VERDICT: CHANGES
    pass_if: "^VERDICT: APPROVE\\s*$"
    on_failure: address_review
  - id: address_review
    type: claude
    jump_only: true
    permission_mode: acceptEdits
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(npm *)
      - Bash(npx *)
      - Bash(git diff*)
    prompt: |
      A reviewer requested changes. Address every point:

      {{steps.review.output}}
    on_success: run_tests
  - id: commit
    type: shell
    run: |
      git add -A
      if git diff --cached --quiet; then echo "nothing to commit"; exit 1; fi
      if [ -n "$FACTORY_VAR_ISSUE" ]; then msg="Resolve #$FACTORY_VAR_ISSUE"; else msg="factory: $(printf '%s' "$FACTORY_TASK" | head -1)"; fi
      git commit -q -m "$msg" -m "Automated by claude-factory (run $FACTORY_RUN_ID)"
      git log --oneline -1
  - id: push
    type: shell
    run: git push -q -u origin HEAD && echo "pushed $(git branch --show-current)"
  - id: linear_push_result
    type: shell
    run: |
      case "$FACTORY_VAR_TICKET" in *[!A-Za-z0-9-]*|'') echo "set var ticket to an issue key like PROJ-123"; exit 1;; esac
      text=$(printf "✅ claude-factory finished: branch \`%s\`\n\n%s\n" "$(git branch --show-current)" "$FACTORY_OUT_IMPLEMENT")
      api="${LINEAR_API_URL:-https://api.linear.app/graphql}"
      # commentCreate needs the issue's UUID, so look it up first.
      uuid=$(jq -n --arg id "$FACTORY_VAR_TICKET" '{query: "query($id: String!) { issue(id: $id) { id } }", variables: {id: $id}}' \
        | curl -sfS -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" --data @- "$api" | jq -re '.data.issue.id')
      jq -n --arg issueId "$uuid" --arg body "$text" '{query: "mutation($issueId: String!, $body: String!) { commentCreate(input: {issueId: $issueId, body: $body}) { success } }", variables: {issueId: $issueId, body: $body}}' \
        | curl -sfS -H "Authorization: $LINEAR_API_KEY" -H "Content-Type: application/json" --data @- "$api" | jq -re '"commented: \(.data.commentCreate.success)"'
