# ─── Plan and code an issue on a feature branch, merged into develop (gitflow) ───
# Generated by scripts/build-flows.mjs from blocks/*.yaml — edit the blocks or the script.
# factory run issue-gitflow --var github_repo=owner/repo --var issue=42 --var test_cmd="./gradlew test"
# 
# pull ticket → feature/<issue>-<title> from develop (develop is created from main if missing) → baseline tests
#   → Opus plans (with size + code areas) → Codex checks (+ risk) → Opus revises
#       too big (limit or planner) → split: low split risk creates the issues itself, else /approve
#   → risk > 75 or Factory_review_plan → wait for /approve
#   → lock the plan's code areas (runs on other areas code at the same time)
#   → Sonnet codes → tests ⟲ fix → 2 × Codex review → docs → commit → push the feature branch
#   → merge into develop (one at a time; changelog merges keep both sides; conflicts → agent resolves)
#   → tests on the merged develop ⟲ fix → push develop → report on the issue
# develop goes to main once a day: see release-daily.
# ────────────────────────────────────────────────────────────────────────
name: issue-gitflow
description: "Gitflow: plan (size limit, risk gate, auto-split) and code an issue on its own feature branch, merge it into develop; parallel runs on different code areas"
workspace: empty
defaults:
  model: claude-sonnet-5-5
  timeout_sec: 2400
  max_budget_usd: 6
  allowed_tools:
    - Read
    - Edit
    - Write
    - Glob
    - Grep
    - Bash(./gradlew *)
    - Bash(gradle *)
    - Bash(./mvnw *)
    - Bash(mvn *)
    - Bash(npm *)
    - Bash(npx *)
    - Bash(yarn *)
    - Bash(pnpm *)
    - Bash(pytest*)
    - Bash(python3 -m pytest*)
    - Bash(python -m pytest*)
    - Bash(go test*)
    - Bash(go build*)
    - Bash(go vet*)
    - Bash(cargo *)
    - Bash(make *)
    - Bash(git status*)
    - Bash(git diff*)
    - Bash(git log*)
    - Bash(git show*)
    - Bash(ls*)
    - Bash(find *)
    - Bash(grep *)
    - Bash(cat *)
    - Bash(head *)
    - Bash(tail *)
    - Bash(wc *)
limits:
  max_cost_usd: 40
vars:
  github_repo: owner/repo
  issue: ""
  test_cmd: auto
  develop_branch: develop
  main_branch: main
  feature_prefix: feature/
  forbidden_paths: ""
  docs_required: ""
  union_merge_files: ""
  agent_env: ""
  risk_threshold: "75"
  review_plan_label: Factory_review_plan
  auto_split_max_risk: "50"
  trigger_label: ""
  max_files: "15"
  max_code_lines: "800"
  delete_merged_branches: yes
  close_when_merged: yes
  revise_above_risk: "50"
  review_twice_above_risk: "50"
  hotfix_labels: bug
  hotfix_prefix: hotfix/
steps:
  - id: pull_ticket
    type: shell
    description: Read the GitHub issue as plain text
    run: |
      case "$FACTORY_VAR_ISSUE" in ''|*[!0-9]*) echo "set the 'issue' variable to an issue number (got '$FACTORY_VAR_ISSUE')"; exit 1;; esac
      gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json number,title,body,url,labels,comments --jq '
        "# #\(.number): \(.title)\n\(.url)\nLabels: \([.labels[].name] | join(", "))\n\n\(.body)\n"
        + ([.comments[] | "\n--- comment by \(.author.login):\n\(.body)"] | join("\n"))'
  - id: feature_branch
    type: shell
    description: Clone, make sure develop exists, and start (or continue) this issue's feature branch from develop
    run: |-
      if [ -d .git ]; then git reset -q --hard && git clean -qfd && git fetch -q origin; else gh repo clone "$FACTORY_VAR_GITHUB_REPO" . -- -q; fi
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"
      if ! git ls-remote --exit-code --heads origin "$dev" >/dev/null 2>&1; then
        # From main — or, when switching over from the rolling pull request, from its unmerged branch.
        from=$("$FACTORY_TOOLS/daily-branch" latest 2>/dev/null || echo NONE); [ "$from" = NONE ] && from="$main"
        git push -q origin "refs/remotes/origin/$from:refs/heads/$dev" 2>/dev/null && echo "created $dev from $from"
      fi
      # (another run may have created it at the same moment — either way it must exist now)
      git fetch -q origin && git rev-parse -q --verify "origin/$dev" >/dev/null || { echo "there is no $dev branch and it could not be created"; exit 1; }
      # Hotfix path: an issue with one of the hotfix labels is built on a hotfix branch from main (see hotfix_branch).
      rm -f "{{run.dir}}/hotfix" "{{run.dir}}/hotfix-note" "{{run.dir}}/hotfix-branch"
      match=""
      if [ -n "$FACTORY_VAR_HOTFIX_LABELS" ]; then
        if labels=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json labels --jq '.labels[].name' 2>/dev/null); then
          oldifs=$IFS; IFS=,; for l in $FACTORY_VAR_HOTFIX_LABELS; do
            l=$(printf '%s' "$l" | sed 's/^ *//; s/ *$//'); if [ -n "$l" ] && printf '%s\n' "$labels" | grep -qixF "$l"; then match="$l"; break; fi
          done; IFS=$oldifs
        elif [ "$FACTORY_HOTFIX" = on ]; then echo "could not read the labels of issue #$FACTORY_VAR_ISSUE, so it is not clear whether this is a hotfix — not starting"; exit 1; fi
      fi
      if [ -n "$match" ]; then
        case "$FACTORY_HOTFIX" in
          on) for f in $FACTORY_VAR_UNION_MERGE_FILES; do echo "$f merge=union" >> .git/info/attributes; done
              touch "{{run.dir}}/hotfix"; echo "HOTFIX: yes (label $match)"; exit 0 ;;
          off) printf '%s\n' "ℹ This issue has the \`$match\` label, but hotfixes to \`$main\` are switched off (Settings → Safety), so it was built as a feature." > "{{run.dir}}/hotfix-note" ;;
          *) printf '%s\n' "ℹ This issue has the \`$match\` label, but the flow is a changed copy of issue-gitflow, and only the unchanged one may push to \`$main\`, so it was built as a feature." > "{{run.dir}}/hotfix-note" ;;
        esac
      fi
      # Keep develop up to date with main (merged pull requests from elsewhere, hotfixes).
      if [ "$(git rev-list --count "origin/$dev..origin/$main")" -gt 0 ]; then
        "$FACTORY_TOOLS/area-lock" acquire "$FACTORY_RUN_ID" "{{run.dir}}" @develop --wait-sec 3600 >/dev/null || exit 1
        git fetch -q origin && git checkout -q -B "$dev" "origin/$dev"
        if git merge -q --no-edit -m "Merge $main into $dev" "origin/$main" >/dev/null 2>&1 && git push -q origin "$dev"; then echo "brought $dev up to date with $main"
        else git merge --abort >/dev/null 2>&1; echo "note: could not merge $main into $dev automatically — do it by hand"; fi
        "$FACTORY_TOOLS/area-lock" release "$FACTORY_RUN_ID" >/dev/null; git fetch -q origin
      fi
      # The changelog only ever gets new entries: keep both sides when branches meet.
      for f in $FACTORY_VAR_UNION_MERGE_FILES; do echo "$f merge=union" >> .git/info/attributes; done
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null)
      slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\{1,\}/-/g; s/^-//; s/-$//' | cut -c1-40 | sed 's/-$//')
      b="$FACTORY_VAR_FEATURE_PREFIX$FACTORY_VAR_ISSUE${slug:+-$slug}"
      if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
        git checkout -q -B "$b" "origin/$b" && git merge -q --no-edit "origin/$dev" >/dev/null || { echo "could not update $b with $dev"; exit 1; }
        echo "BRANCH: $b (continuing, up to date with $dev)"
      else git checkout -q -B "$b" "origin/$dev" || exit 1; echo "BRANCH: $b (new, from $dev)"; fi
      [ "$(git branch --show-current)" = "$b" ] || { echo "not on $b"; exit 1; }
      git log --oneline -1
    routes:
      - if: "^HOTFIX: yes"
        goto: baseline_main
  - id: baseline_tests
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      if [ "$code" -ne 0 ]; then echo "the tests failed — running them once more (a test can fail by chance on a busy machine)"; touch "$marker"; sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?; [ "$code" -eq 0 ] && echo "passed the second time: a flaky test, not a real failure"; fi
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: baseline_failed
    description: Tests must pass before we change anything (a failing run is tried once more)
  - id: baseline_main
    type: shell
    timeout_sec: 3600
    run: |-
      git fetch -q origin && git checkout -q -B "$FACTORY_VAR_MAIN_BRANCH" "origin/$FACTORY_VAR_MAIN_BRANCH" || { echo "cannot switch to $FACTORY_VAR_MAIN_BRANCH"; exit 1; }
      rm -f "{{run.dir}}/baseline-sha"; git rev-parse HEAD > "{{run.dir}}/baseline-sha.new"
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      if [ "$code" -ne 0 ]; then echo "the tests failed — running them once more (a test can fail by chance on a busy machine)"; touch "$marker"; sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?; [ "$code" -eq 0 ] && echo "passed the second time: a flaky test, not a real failure"; fi
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      if [ "$code" -eq 0 ]; then mv "{{run.dir}}/baseline-sha.new" "{{run.dir}}/baseline-sha"; fi
      exit "$code"
    on_failure: baseline_failed
    description: "Hotfix: the tests must pass on the newest main before we change anything"
    jump_only: true
    on_success: hotfix_branch
  - id: hotfix_branch
    type: shell
    jump_only: true
    description: Start (or continue) this issue's hotfix branch from the newest main
    run: |-
      main="$FACTORY_VAR_MAIN_BRANCH"
      # Start from the commit the baseline tests passed on (main may have moved since; merge_main brings it in).
      base=$(cat "{{run.dir}}/baseline-sha" 2>/dev/null) || { echo "the tests did not pass on $main before the change (no tested commit)"; exit 1; }
      git fetch -q origin && git cat-file -e "$base^{commit}" || { echo "cannot find the tested commit $base"; exit 1; }
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null)
      slug=$(printf '%s' "$title" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]\{1,\}/-/g; s/^-//; s/-$//' | cut -c1-40 | sed 's/-$//')
      b="$FACTORY_VAR_HOTFIX_PREFIX$FACTORY_VAR_ISSUE${slug:+-$slug}"
      if git ls-remote --exit-code --heads origin "$b" >/dev/null 2>&1; then
        git checkout -q -B "$b" "origin/$b" && git merge -q --no-edit "$base" >/dev/null || { echo "could not update $b with $main"; exit 1; }
        echo "BRANCH: $b (continuing, up to date with $main)"
      else git checkout -q -B "$b" "$base" || exit 1; echo "BRANCH: $b (new, from $main)"; fi
      [ "$(git branch --show-current)" = "$b" ] || { echo "not on $b"; exit 1; }
      echo "$b" > "{{run.dir}}/hotfix-branch"
      git log --oneline -1
    on_success: plan
  - id: plan
    type: claude
    model: claude-opus-5-5
    effort: xhigh
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(git show*)
      - Bash(git grep*)
      - Bash(ls*)
    prompt: |-
      You are the lead architect for this repository. Plan the work for the GitHub issue below so that
      another engineer can implement it without having to make design decisions. Do NOT modify files.

      {{steps.pull_ticket.output}}

      {{steps.clone.output}}
      Paths that must not be changed: {{vars.forbidden_paths}}
      The issue text above already includes all of its comments — do not try to fetch them (gh and web
      access are not available here). They may contain a previous plan and feedback on it — the feedback wins.
      If earlier questions were asked and the owner replied /defaults, take the recommendations as the answers.

      Investigate before you write (this is the most important part):
      - Read CLAUDE.md, the design docs it points to, and the parts of the code this issue touches.
      - Find the existing classes, interfaces and patterns to reuse or extend, and how similar features
        were built. Check how the code is tested today (test style, helpers, fixtures).
      - Verify every class, file, function and module you mention actually exists as you describe it.
        If something must be created, say so explicitly.

      Then decide:
      - NOT_CODE: not a coding task (legal, approval, research, rollout, …). Explain why.

      Size limit: one issue must stay reviewable — at most {{vars.max_files}} files changed and about
      {{vars.max_code_lines}} lines of new or changed production code (tests and docs don't count). If your plan
      would exceed that, the issue is TOO_BIG: split it instead.
      - TOO_BIG: cannot be done well as one focused, reviewable change. Propose a split into smaller
        issues (title + 2-3 lines each) that can each be built and tested on their own, in order.
        For TOO_BIG, write the split in exactly this format so the factory can create the issues:
          ## Split
          ### ISSUE 1: <title>
          DEPENDS_ON: none   (or earlier parts by number, e.g. 1 or 1, 2; or existing issues, e.g. #72)
          <the issue text: the user story, a "### Acceptance criteria" checklist, and "### Notes for this codebase">
          ### ISSUE 2: <title>
          …
        Each part must be buildable and testable on its own; together they cover every acceptance criterion
        of this issue. Then score how risky it is to create these issues WITHOUT the owner looking (0-100):
        0-25 a mechanical split along existing boundaries, nothing dropped or decided; 26-50 only ordering or
        boundary choices; 51-75 some scope is deferred or reinterpreted; 76-100 the split changes what the issue
        asks for, or needs decisions only the owner can make. Write it as the line: SPLIT_RISK: <0-100>
        If the owner already agreed to split this issue (in the comments above), also write: SPLIT_APPROVED: yes
      - NEEDS_INFO: a decision only the owner can make, or missing requirements. Ask specific questions
        with the options you see and your recommendation. Do not guess on things that matter.
      - READY: write the plan with these sections:
        ## Goal — what will work when this is done, in one or two sentences.
        ## Acceptance criteria — a checklist that can be verified.
        ## Design — the approach, and why it fits the existing architecture. Alternatives you rejected, briefly.
        ## Changes — per module/file (existing paths, or marked NEW): what changes. Include signatures of
           new public types/functions.
        ## Implementation steps — ordered, each small enough to compile and test.
        ## Tests — the concrete test cases to add (unit/integration), including edge cases and failure paths.
        ## Documentation — what goes in the changelog / user guide.
        ## Risks & open points — what could go wrong, migrations, performance, security, compatibility.
        No new dependencies unless the issue asks for them. Be concrete; skip filler.

      Also score how risky it is to build this plan without a human checking it first (0-100):
      - 0-25: a local change, well covered by tests, easy to undo.
      - 26-50: several modules, or new behaviour users see; tests can cover it.
      - 51-75: persistence or migrations, concurrency, public APIs or file formats, or hard to test automatically.
      - 76-100: security or trust (authentication, signing, secrets, crypto), installing/updating/deleting
        software or user data, irreversible operations, privacy/legal, or the plan rests on assumptions
        you could not verify in the code.
      For READY, end the plan with a "## Risk" section explaining the score, then these two lines:
      RISK_SCORE: <0-100>
      RISK_REASON: <one line>
      For READY, also end the plan with these two lines:
      SIZE: <number of files changed> files, <estimated lines of production code> lines
      AREAS: <comma-separated directories or files you will change, as specific as possible; list single shared
        files such as Main.kt or a settings screen by their path; list test FILES, never a whole tests folder;
        leave out docs, the changelog and the user guide>

      End with exactly one line: PLAN_STATUS: READY | NEEDS_INFO | NOT_CODE | TOO_BIG
    routes:
      - if: "^PLAN_STATUS: READY\\s*$"
        goto: plan_review
      - if: "^PLAN_STATUS: TOO_BIG\\s*$"
        goto: split_gate
    on_success: send_back
    max_budget_usd: 8
  - id: plan_review
    type: claude
    agent: codex
    effort: high
    jump_only: true
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
    description: A second model checks the plan against the real code (skipped if Codex is unavailable)
    prompt: |-
      Review this implementation plan for the GitHub issue below, against the actual code in this
      repository. Do not change files. Check:
      - Does every file, class, function and module it mentions exist as described? Wrong assumptions?
      - Does it cover the whole issue and all acceptance criteria? Missing steps, migrations, wiring?
      - Does it fit the existing architecture and patterns, or is there a simpler way that fits better?
      - Are the tests enough (edge cases, failure paths)? Security, data loss, concurrency risks?
      Report only real problems, each with what is wrong and what the plan should say instead.

      {{steps.pull_ticket.output}}

      === PLAN ===
      {{steps.plan.output}}

      Also score how risky it is to build this plan without a human checking it first (0-100):
      - 0-25: a local change, well covered by tests, easy to undo.
      - 26-50: several modules, or new behaviour users see; tests can cover it.
      - 51-75: persistence or migrations, concurrency, public APIs or file formats, or hard to test automatically.
      - 76-100: security or trust (authentication, signing, secrets, crypto), installing/updating/deleting
        software or user data, irreversible operations, privacy/legal, or the plan rests on assumptions
        you could not verify in the code.
      Give your own score (not the plan's) as a line: RISK_SCORE: <0-100>

      End with exactly one line: VERDICT: APPROVE   or   VERDICT: CHANGES
    routes:
      - if: "^VERDICT: APPROVE\\s*$"
        goto: size_gate
    on_success: revise_gate
    on_failure: size_gate
  - id: revise_gate
    type: shell
    jump_only: true
    description: "Low-risk plan: skip the revision; Codex's notes go to the coder with the plan"
    run: |-
      score() { printf '%s\n' "$1" | sed -n 's/^RISK_SCORE: *\([0-9][0-9]*\).*/\1/p' | tail -1; }
      p=$(score "$FACTORY_OUT_PLAN"); c=$(score "$FACTORY_OUT_PLAN_REVIEW"); r=${p:-100}; [ -n "$c" ] && [ "$c" -gt "$r" ] && r=$c
      if [ "$r" -gt "${FACTORY_VAR_REVISE_ABOVE_RISK:-50}" ]; then echo "risk $r: revise the plan"; echo "REVISE"; else echo "risk $r (≤ ${FACTORY_VAR_REVISE_ABOVE_RISK:-50}): Codex's notes go straight to the coder"; echo "SKIPPED"; fi
    routes:
      - if: ^REVISE\s*$
        goto: revise_plan
    on_success: size_gate
  - id: revise_plan
    type: claude
    model: claude-opus-5-5
    effort: xhigh
    jump_only: true
    description: "Fresh session: check only the reviewer's points, then write the final plan (falls back to the draft on failure)"
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(git show*)
      - Bash(git grep*)
      - Bash(ls*)
    prompt: |-
      You are the lead architect for this repository. Below are a GitHub issue, the implementation plan
      you drafted for it, and a second reviewer's check of that plan against the code. Do NOT modify files.

      Check each review point in the code: open only the files needed to confirm or refute that point —
      the rest of the draft was already verified, do not re-investigate it. Adopt the points that are right
      and ignore the ones that are wrong. Then output the complete final plan (all sections, not just the
      changes), followed by a short "## Review notes" section listing which points you adopted and which you
      rejected, with one line why.
      Keep the "## Risk" section and the RISK_SCORE / RISK_REASON lines, updated if the review changed
      the picture (never lower the score just because the reviewer scored lower).
      Keep the SIZE and AREAS lines, updated to the final plan. If the final plan is over the size limit
      ({{vars.max_files}} files / about {{vars.max_code_lines}} lines of production code), answer TOO_BIG with a split instead.
        For TOO_BIG, write the split in exactly this format so the factory can create the issues:
          ## Split
          ### ISSUE 1: <title>
          DEPENDS_ON: none   (or earlier parts by number, e.g. 1 or 1, 2; or existing issues, e.g. #72)
          <the issue text: the user story, a "### Acceptance criteria" checklist, and "### Notes for this codebase">
          ### ISSUE 2: <title>
          …
        Each part must be buildable and testable on its own; together they cover every acceptance criterion
        of this issue. Then score how risky it is to create these issues WITHOUT the owner looking (0-100):
        0-25 a mechanical split along existing boundaries, nothing dropped or decided; 26-50 only ordering or
        boundary choices; 51-75 some scope is deferred or reinterpreted; 76-100 the split changes what the issue
        asks for, or needs decisions only the owner can make. Write it as the line: SPLIT_RISK: <0-100>
        If the owner already agreed to split this issue (in the comments above), also write: SPLIT_APPROVED: yes

      {{steps.pull_ticket.output}}

      === YOUR DRAFT PLAN ===
      {{steps.plan.output}}

      === REVIEW ===
      {{steps.plan_review.output}}

      End with exactly one line: PLAN_STATUS: READY | NEEDS_INFO | NOT_CODE | TOO_BIG
    routes:
      - if: "^PLAN_STATUS: READY\\s*$"
        goto: size_gate
      - if: "^PLAN_STATUS: TOO_BIG\\s*$"
        goto: split_gate
      - if: "^PLAN_STATUS: [A-Z_]+\\s*$"
        goto: send_back
    on_success: size_gate
    on_failure: size_gate
    max_budget_usd: 8
  - id: send_back
    type: shell
    jump_only: true
    description: Post why the issue can't be planned yet, then stop (resumes when someone replies)
    resume_from: pull_ticket
    run: |-
      out="${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}"
      status=$(printf '%s\n' "$out" | sed -n 's/^PLAN_STATUS: *\([A-Z_]*\).*/\1/p' | tail -1)
      case "$status" in
        NEEDS_INFO) head="needs more information before it can plan this issue:" ;;
        NOT_CODE) head="thinks this issue is not a coding task:" ;;
        TOO_BIG) head="thinks this issue is too big for one change and proposes splitting it:" ;;
        *) echo "planning failed: no PLAN_STATUS line"; exit 1 ;;
      esac
      { echo "$FACTORY_FIRST_PLANNER_QUESTIONS"; echo
        echo "🤖 **Spaghetti Code Foundry** $head"; echo
        printf '%s\n' "$out" | sed '/^PLAN_STATUS:/d'
        echo; echo "_${FACTORY_NEXT_PLANNER_QUESTIONS}_"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file -
    on_success: stop
  - id: split_gate
    type: shell
    jump_only: true
    description: "Low-risk split (or already agreed): create the issues; otherwise ask the owner"
    run: |-
      out="${FACTORY_OUT_FORCE_SPLIT:-${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}}"
      printf '%s\n' "$out" | grep -q "^### ISSUE [0-9]" || { echo "SPLIT: none (no parts in the answer)"; exit 0; }
      risk=$(printf '%s\n' "$out" | sed -n 's/^SPLIT_RISK: *\([0-9][0-9]*\).*/\1/p' | tail -1); risk=${risk:-100}
      limit=${FACTORY_VAR_AUTO_SPLIT_MAX_RISK:-50}; agreed=""; forced=""
      printf '%s\n' "$out" | grep -q "^SPLIT_APPROVED: *yes" && agreed=yes
      if [ -n "$FACTORY_VAR_REVIEW_PLAN_LABEL" ] && gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$FACTORY_VAR_REVIEW_PLAN_LABEL"; then forced=yes; fi
      if [ -n "$agreed" ]; then echo "The owner already agreed to the split — creating the issues."; echo "GATE: no"; exit 0; fi
      if [ "$risk" -le "$limit" ] && [ -z "$forced" ] && [ ! -f "{{run.dir}}/hotfix" ]; then echo "Split risk $risk/100 (≤ $limit) — creating the issues without asking."; echo "GATE: no"; exit 0; fi
      why="the split risk is $risk/100 (above $limit)"; [ -n "$forced" ] && why="the issue has the \`$FACTORY_VAR_REVIEW_PLAN_LABEL\` label"
      [ -f "{{run.dir}}/hotfix" ] && why="this is a hotfix, and a hotfix is never split by itself"
      { echo "$FACTORY_FIRST_APPROVE_SPLIT"; echo
        echo "🤖 **Spaghetti Code Foundry** thinks this issue is too big for one change and proposes splitting it (**split risk: $risk/100**):"; echo
        printf '%s\n' "$out" | sed '/^PLAN_STATUS:/d; /^SPLIT_RISK:/d; /^SPLIT_APPROVED:/d'
        echo; echo "✋ **You decide** ($why)."
        echo; echo "_${FACTORY_NEXT_APPROVE_SPLIT}_"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID approval -->"; } | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file - >/dev/null
      echo "asked the owner: $why"; echo "GATE: yes"
    routes:
      - if: "^SPLIT: none"
        goto: send_back
      - if: "^GATE: yes\\s*$"
        goto: approve_split
    on_success: create_split
  - id: approve_split
    type: approval
    jump_only: true
    message: Split {{vars.github_repo}}#{{vars.issue}} into the proposed issues? (reply /approve or /reject on the issue)
    on_success: create_split
    on_failure: pull_ticket
  - id: create_split
    type: shell
    jump_only: true
    description: Create the parts as issues (in order, with Depends on and the build label), then close this issue
    run: printf '%s\n' "${FACTORY_OUT_FORCE_SPLIT:-${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}}" | "$FACTORY_TOOLS/create-split"
    on_success: end
  - id: size_gate
    type: shell
    description: Plans over the size limit are split instead of built
    run: |-
      out="$FACTORY_OUT_PLAN"; notes=""
      if printf '%s\n' "$FACTORY_OUT_REVISE_PLAN" | grep -q "^PLAN_STATUS: READY"; then out="$FACTORY_OUT_REVISE_PLAN"
      elif [ -n "$FACTORY_OUT_PLAN_REVIEW" ]; then notes="$FACTORY_OUT_PLAN_REVIEW"; fi
      size=$(printf '%s\n' "$out" | sed -n 's/^SIZE: *//p' | tail -1)
      files=$(printf '%s\n' "$size" | sed -n 's/^\([0-9][0-9]*\) *files.*/\1/p'); lines=$(printf '%s\n' "$size" | sed -n 's/.*[, ] *\([0-9][0-9]*\) *lines.*/\1/p')
      echo "planned size: ${files:-?} files, ${lines:-?} lines of production code (limit ${FACTORY_VAR_MAX_FILES} files, ${FACTORY_VAR_MAX_CODE_LINES} lines)"
      if [ -n "$files" ] && [ "$files" -gt "$FACTORY_VAR_MAX_FILES" ] || { [ -n "$lines" ] && [ "$lines" -gt "$FACTORY_VAR_MAX_CODE_LINES" ]; }; then echo "SIZE: over"; else echo "SIZE: ok"; fi
    routes:
      - if: "^SIZE: over\\s*$"
        goto: force_split
    on_success: risk_gate
  - id: force_split
    type: claude
    model: claude-opus-5-5
    effort: high
    resume: plan
    jump_only: true
    max_budget_usd: 6
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
      - Bash(git log*)
      - Bash(git show*)
      - Bash(git grep*)
      - Bash(ls*)
    prompt: |-
      Your plan is over the size limit for one issue:
      {{steps.size_gate.output}}

      Split this issue into smaller issues instead, each within the limit and buildable and testable on its
      own, in order. Use the plan you made (and the review notes, if any) for the parts.
      For TOO_BIG, write the split in exactly this format so the factory can create the issues:
        ## Split
        ### ISSUE 1: <title>
        DEPENDS_ON: none   (or earlier parts by number, e.g. 1 or 1, 2; or existing issues, e.g. #72)
        <the issue text: the user story, a "### Acceptance criteria" checklist, and "### Notes for this codebase">
        ### ISSUE 2: <title>
        …
      Each part must be buildable and testable on its own; together they cover every acceptance criterion
      of this issue. Then score how risky it is to create these issues WITHOUT the owner looking (0-100):
      0-25 a mechanical split along existing boundaries, nothing dropped or decided; 26-50 only ordering or
      boundary choices; 51-75 some scope is deferred or reinterpreted; 76-100 the split changes what the issue
      asks for, or needs decisions only the owner can make. Write it as the line: SPLIT_RISK: <0-100>
      If the owner already agreed to split this issue (in the comments above), also write: SPLIT_APPROVED: yes

      End with exactly one line: PLAN_STATUS: TOO_BIG
    routes:
      - if: "^PLAN_STATUS: TOO_BIG\\s*$"
        goto: split_gate
    on_success: risk_gate
    on_failure: risk_gate
  - id: risk_gate
    type: shell
    description: Post the plan with its risk score; above the threshold (or with the review label) a human approves first
    run: |-
      out="$FACTORY_OUT_PLAN"; notes=""
      if printf '%s\n' "$FACTORY_OUT_REVISE_PLAN" | grep -q "^PLAN_STATUS: READY"; then out="$FACTORY_OUT_REVISE_PLAN"
      elif [ -n "$FACTORY_OUT_PLAN_REVIEW" ]; then notes="$FACTORY_OUT_PLAN_REVIEW"; fi
      score() { printf '%s\n' "$1" | sed -n 's/^RISK_SCORE: *\([0-9][0-9]*\).*/\1/p' | tail -1; }
      p=$(score "$out"); [ -n "$p" ] || p=$(score "$FACTORY_OUT_PLAN"); c=$(score "$FACTORY_OUT_PLAN_REVIEW")
      reason=$(printf '%s\n' "$out" | sed -n 's/^RISK_REASON: *//p' | tail -1)
      if [ -z "$p" ]; then risk=100; reason="the plan has no risk score"; else risk=$p; fi
      if [ -n "$c" ] && [ "$c" -gt "$risk" ]; then risk=$c; reason="${reason:+$reason — }Codex scored it $c"; fi
      [ "$risk" -gt 100 ] && risk=100
      limit=${FACTORY_VAR_RISK_THRESHOLD:-75}; gate=no; why=""
      if [ "$risk" -gt "$limit" ]; then gate=yes; why="the risk score is above $limit"; fi
      if [ -n "$FACTORY_VAR_REVIEW_PLAN_LABEL" ] && gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json labels --jq '.labels[].name' 2>/dev/null | grep -qx "$FACTORY_VAR_REVIEW_PLAN_LABEL"; then
        gate=yes; why="${why:+$why, and }the issue has the \`$FACTORY_VAR_REVIEW_PLAN_LABEL\` label"
      fi
      plan=$(printf '%s\n' "$out" | sed '/^PLAN_STATUS:/d; /^RISK_SCORE:/d; /^RISK_REASON:/d')
      [ "$gate" = yes ] && [ -f "{{run.dir}}/hotfix" ] && why="$why. This is a hotfix: after the reviews it goes straight to \`$FACTORY_VAR_MAIN_BRANCH\`, so a person should look at the plan first"
      reviewed=""; [ -n "$FACTORY_OUT_PLAN_REVIEW" ] && reviewed=" (checked against the code by Codex)"
      [ -n "$notes" ] && reviewed=" (draft — the revision did not finish; Codex's review notes are below)"
      printf '%s\n' "$FACTORY_OUT_REVISE_GATE" | grep -q "^SKIPPED" && reviewed=" (checked against the code by Codex — low risk, so the coder works in Codex's notes below)"
      if [ "$gate" = yes ]; then first="$FACTORY_FIRST_APPROVE_PLAN"; else first="$FACTORY_FIRST_NOTHING"; fi
      { echo "$first"; echo
        echo "🤖 **Spaghetti Code Foundry plan**$reviewed"; echo; echo "**Risk: $risk/100**${reason:+ — $reason}"; echo
        printf '%s\n' "$plan"
        if [ -n "$notes" ]; then echo; echo "## Codex review notes (not yet worked in)"; echo; printf '%s\n' "$notes" | sed '/^VERDICT:/d; /^RISK_SCORE:/d'; fi
        echo
        if [ "$gate" = yes ]; then
          echo "✋ **A human decides before coding starts:** $why."
          echo; echo "_${FACTORY_NEXT_APPROVE_PLAN}_"
          echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID approval -->"
        else
          echo "_Coding starts now; the result goes into the Foundry pull request, where you review it._"
          echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID plan -->"
        fi; } | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file - >/dev/null
      printf '%s\n' "$plan"
      [ -n "$notes" ] && { echo; echo "## Review notes to work in"; printf '%s\n' "$notes" | sed '/^VERDICT:/d; /^RISK_SCORE:/d'; }
      echo; echo "RISK: $risk"; echo "GATE: $gate"
    routes:
      - if: "^GATE: yes\\s*$"
        goto: approve_plan
    on_success: claim_areas
  - id: approve_plan
    type: approval
    jump_only: true
    message: Approve the plan for {{vars.github_repo}}#{{vars.issue}} (reply /approve or /reject on the issue)
    on_success: claim_areas
    on_failure: pull_ticket
  - id: claim_areas
    type: shell
    description: Lock the code areas the plan changes; if another run holds one, step aside (free the slot) and continue when it is free
    run: |-
      plan="${FACTORY_OUT_REVISE_PLAN:-$FACTORY_OUT_PLAN}"; printf '%s\n' "$FACTORY_OUT_REVISE_PLAN" | grep -q "^AREAS:" || plan="$FACTORY_OUT_PLAN"
      areas=$(printf '%s\n' "$plan" | sed -n 's/^AREAS: *//p' | tail -1 | tr -d '`')
      [ -n "$areas" ] || areas="*"
      out=$("$FACTORY_TOOLS/area-lock" acquire "$FACTORY_RUN_ID" "{{run.dir}}" $(printf '%s' "$areas" | tr ',' ' ') --wait-sec 0); code=$?
      printf '%s\n' "$out"
      [ "$code" = 0 ] && exit 0
      printf '%s\n' "$out" | grep -q "^TIMEOUT:" && { echo "WAIT_AREA"; exit 0; }
      exit "$code"
    routes:
      - if: ^WAIT_AREA\s*$
        goto: wait_for_area
    on_success: implement
  - id: wait_for_area
    type: shell
    jump_only: true
    description: "Another run works in the same code area: stop without holding a slot; resumed as soon as runs finish"
    resume_from: claim_areas
    max_visits: 1000
    run: printf '%s\n' "$FACTORY_OUT_CLAIM_AREAS" | grep "^waiting for run" | tail -1
    on_success: stop
  - id: implement
    type: claude
    prompt: |-
      Implement GitHub issue below in this repository.

      {{steps.pull_ticket.output}}

      Follow this plan (comments from people on the issue override it):

      {{steps.risk_gate.output}}

      Notes from the person who approved the plan, if any: {{steps.approve_plan.output}}

      Follow the repository's CLAUDE.md conventions.
      - Add or update tests for everything you change.
      - Do not add new dependencies. Do not change: {{vars.forbidden_paths}}
      - Do not write documentation yet; that is a separate step.
      - Do not commit.
      - You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      Things learned from earlier runs in this repo:
      {{learnings}}

      Finish with a short summary of what you changed (files and why).
  - id: guard
    type: shell
    description: No forbidden paths, no disabled or deleted tests, something changed
    run: |-
      git add -A -N >/dev/null 2>&1 || true
      changed=$(git diff HEAD --name-only)
      [ -n "$changed" ] || { echo "no changes were made"; exit 1; }
      bad=0
      for p in $FACTORY_VAR_FORBIDDEN_PATHS; do
        hits=$(printf '%s\n' "$changed" | grep "^$p" || true)
        [ -n "$hits" ] && { echo "changes in forbidden path $p:"; printf '%s\n' "$hits"; bad=1; }
      done
      added=$(git diff HEAD -U0 | grep '^+' | grep -v '^+++' || true)
      removed=$(git diff HEAD -U0 | grep '^-' | grep -v '^---' || true)
      skips=$(printf '%s\n' "$added" | grep -E '@Disabled|@Ignore\b|\.skip\(|\bxit\(|\bxdescribe\(|@pytest\.mark\.skip|t\.Skip\(' || true)
      [ -n "$skips" ] && { echo "tests were disabled or skipped:"; printf '%s\n' "$skips"; bad=1; }
      pat='@Test\b|@ParameterizedTest|\bit\(|\btest\(|def test_'
      rt=$(printf '%s\n' "$removed" | grep -Ec "$pat" || true); at=$(printf '%s\n' "$added" | grep -Ec "$pat" || true)
      [ "$rt" -gt "$at" ] && { echo "tests were removed ($rt removed, $at added)"; bad=1; }
      [ "$bad" = 0 ] && echo "guard ok: $(printf '%s\n' "$changed" | wc -l | tr -d " ") files changed"
      exit "$bad"
    on_failure: fix_guard
  - id: fix_guard
    type: claude
    resume: implement
    jump_only: true
    max_visits: 2
    prompt: |-
      Your changes broke a rule of this factory. Fix that (restore removed/disabled tests, revert changes in forbidden paths, or make the missing change):

      {{steps.guard.output}}
    on_success: guard
  - id: run_tests
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: fix_tests
  - id: fix_tests
    type: claude
    resume: implement
    jump_only: true
    max_visits: 3
    prompt: |-
      The tests fail. Fix the code so they pass. Never delete, disable or weaken tests to make them pass;
      change a test only if the test itself is wrong, and say so.
      You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      {{steps.run_tests.output}}
    on_success: run_tests
  - id: review_1
    type: claude
    agent: codex
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
    prompt: |-
      Code review, round 1 of 2. Another AI implemented the GitHub issue below; its changes are
      uncommitted in this repository (run `git status` and `git diff HEAD`). Review them strictly for
      correctness, edge cases, security, error handling, test coverage and fit with the existing code.
      Report only real problems, each with file, line, problem and the fix. No style nitpicks.
      Start each problem with [high] (wrong behaviour, data loss, security, a crash), [medium] or [low].

      {{steps.pull_ticket.output}}

      End with these two lines: SEVERITY: high | medium | low | none   (the most serious problem)
      VERDICT: APPROVE   or   VERDICT: CHANGES
    routes:
      - if: "^VERDICT: APPROVE\\s*$"
        goto: docs
  - id: address_review_1
    type: claude
    resume: implement
    prompt: |-
      A reviewer (Codex) looked at your changes. Fix every point you agree with. For points you
      disagree with, explain why in one line each. Keep tests passing; don't write docs yet.

      {{steps.review_1.output}}
  - id: run_tests_1
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: fix_tests_1
  - id: fix_tests_1
    type: claude
    resume: implement
    jump_only: true
    max_visits: 3
    prompt: |-
      The tests fail. Fix the code so they pass. Never delete, disable or weaken tests to make them pass;
      change a test only if the test itself is wrong, and say so.
      You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      {{steps.run_tests_1.output}}
    on_success: run_tests_1
  - id: review_gate
    type: shell
    description: Second review round only after a [high] finding or for riskier stories
    run: |-
      sev=$(printf '%s\n' "$FACTORY_OUT_REVIEW_1" | sed -n 's/^SEVERITY: *\([a-z]*\).*/\1/p' | tail -1)
      risk=$(printf '%s\n' "$FACTORY_OUT_RISK_GATE" | sed -n 's/^RISK: *\([0-9][0-9]*\).*/\1/p' | tail -1)
      if [ "${sev:-high}" = high ] || [ "${risk:-100}" -gt "${FACTORY_VAR_REVIEW_TWICE_ABOVE_RISK:-50}" ]; then echo "round 2: severity ${sev:-unknown}, risk ${risk:-unknown}"; echo "REVIEW_AGAIN"
      else echo "no round 2 needed: severity $sev, risk $risk"; echo "DONE"; fi
    routes:
      - if: ^DONE\s*$
        goto: docs
  - id: review_2
    type: claude
    agent: codex
    permission_mode: dontAsk
    allowed_tools:
      - Read
      - Glob
      - Grep
    prompt: |-
      Code review, round 2 of 2. Another AI implemented the GitHub issue below; its changes are
      uncommitted in this repository (run `git status` and `git diff HEAD`). Review them strictly for
      correctness, edge cases, security, error handling, test coverage and fit with the existing code.
      Report only real problems, each with file, line, problem and the fix. No style nitpicks.
      Start each problem with [high] (wrong behaviour, data loss, security, a crash), [medium] or [low].

      {{steps.pull_ticket.output}}

      End with these two lines: SEVERITY: high | medium | low | none   (the most serious problem)
      VERDICT: APPROVE   or   VERDICT: CHANGES
    routes:
      - if: "^VERDICT: APPROVE\\s*$"
        goto: docs
  - id: address_review_2
    type: claude
    resume: implement
    prompt: |-
      A reviewer (Codex) looked at your changes. Fix every point you agree with. For points you
      disagree with, explain why in one line each. Keep tests passing; don't write docs yet.

      {{steps.review_2.output}}
  - id: run_tests_2
    type: shell
    timeout_sec: 3600
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_failure: fix_tests_2
  - id: fix_tests_2
    type: claude
    resume: implement
    jump_only: true
    max_visits: 3
    prompt: |-
      The tests fail. Fix the code so they pass. Never delete, disable or weaken tests to make them pass;
      change a test only if the test itself is wrong, and say so.
      You may run the build and the tests yourself (e.g. `./gradlew test --tests <Class>`, `npm test`); after you, the flow runs: {{vars.test_cmd}}

      {{steps.run_tests_2.output}}
    on_success: run_tests_2
  - id: docs
    type: claude
    resume: implement
    prompt: |-
      Now document the change you made for this issue, following the repository's documentation rules
      (CLAUDE.md). If there are none: update README/docs where behaviour changed, and add doc comments
      to new public APIs. Required files that must be updated: {{vars.docs_required}}

      {{steps.pull_ticket.output}}

      What was implemented:
      {{steps.implement.output}}

      {{steps.final_guard.output}}
    max_visits: 2
  - id: final_guard
    type: shell
    description: "Same checks as guard, plus: required docs were updated"
    run: |-
      git add -A -N >/dev/null 2>&1 || true
      changed=$(git diff HEAD --name-only)
      [ -n "$changed" ] || { echo "no changes were made"; exit 1; }
      bad=0
      for p in $FACTORY_VAR_FORBIDDEN_PATHS; do
        hits=$(printf '%s\n' "$changed" | grep "^$p" || true)
        [ -n "$hits" ] && { echo "changes in forbidden path $p:"; printf '%s\n' "$hits"; bad=1; }
      done
      added=$(git diff HEAD -U0 | grep '^+' | grep -v '^+++' || true)
      removed=$(git diff HEAD -U0 | grep '^-' | grep -v '^---' || true)
      skips=$(printf '%s\n' "$added" | grep -E '@Disabled|@Ignore\b|\.skip\(|\bxit\(|\bxdescribe\(|@pytest\.mark\.skip|t\.Skip\(' || true)
      [ -n "$skips" ] && { echo "tests were disabled or skipped:"; printf '%s\n' "$skips"; bad=1; }
      pat='@Test\b|@ParameterizedTest|\bit\(|\btest\(|def test_'
      rt=$(printf '%s\n' "$removed" | grep -Ec "$pat" || true); at=$(printf '%s\n' "$added" | grep -Ec "$pat" || true)
      [ "$rt" -gt "$at" ] && { echo "tests were removed ($rt removed, $at added)"; bad=1; }
      for f in $FACTORY_VAR_DOCS_REQUIRED; do
        printf '%s\n' "$changed" | grep -qx "$f" || { echo "documentation not updated: $f"; bad=1; }
      done
      [ "$bad" = 0 ] && echo "guard ok: $(printf '%s\n' "$changed" | wc -l | tr -d " ") files changed"
      exit "$bad"
    on_failure: docs
  - id: commit
    type: shell
    run: |-
      git add -A
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null)
      git commit -q -m "Resolve #$FACTORY_VAR_ISSUE: $title" -m "Written by Claude, reviewed by Codex, tests passing. Spaghetti Code Foundry run $FACTORY_RUN_ID"
      git log --oneline -1
  - id: push_feature
    type: shell
    run: |-
      b=$(git branch --show-current)
      if [ -f "{{run.dir}}/hotfix" ]; then
        case "$b" in "$FACTORY_VAR_HOTFIX_PREFIX"*) ;; *) echo "refusing to push $b: not a hotfix branch"; exit 1;; esac
      else
        case "$b" in "$FACTORY_VAR_FEATURE_PREFIX"*) ;; *) echo "refusing to push $b: not a feature branch"; exit 1;; esac
      fi
      git push -q -u origin HEAD && echo "pushed $b" || exit 1
      [ -f "{{run.dir}}/hotfix" ] && echo "HOTFIX: yes"; exit 0
    routes:
      - if: "^HOTFIX: yes\\s*$"
        goto: merge_main
    on_success: merge_develop
  - id: merge_develop
    type: shell
    max_visits: 4
    timeout_sec: 7200
    description: Merge the feature branch into develop (one merge at a time); conflicts go to an agent
    run: |-
      "$FACTORY_TOOLS/area-lock" acquire "$FACTORY_RUN_ID" "{{run.dir}}" @develop --wait-sec 7000 >/dev/null || { echo "develop stayed locked too long"; exit 1; }
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; f=$(git rev-parse --abbrev-ref HEAD); [ "$f" = "$dev" ] && f=$(cat "{{run.dir}}/feature-branch")
      echo "$f" > "{{run.dir}}/feature-branch"
      git merge --abort >/dev/null 2>&1 || true
      # Work left uncommitted on the feature branch (e.g. after an interruption) is committed, never dropped.
      if [ "$(git rev-parse --abbrev-ref HEAD)" = "$f" ] && [ -n "$(git status --porcelain)" ]; then
        git add -A && git commit -q -m "Resolve #$FACTORY_VAR_ISSUE: remaining changes" && git push -q origin "$f" && echo "committed and pushed changes left on $f"
      fi
      git fetch -q origin "$dev" || { echo "cannot fetch $dev"; exit 2; }
      git checkout -q -B "$dev" "origin/$dev" || { echo "cannot switch to $dev (see above)"; exit 2; }
      [ "$(git rev-parse --abbrev-ref HEAD)" = "$dev" ] || { echo "not on $dev"; exit 2; }
      git rev-parse HEAD > "{{run.dir}}/develop-before"
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null)
      if git merge --no-ff --no-edit -m "Merge #$FACTORY_VAR_ISSUE: $title ($f)" "$f" >/dev/null 2>&1; then echo "MERGED: $f into $dev"; exit 0; fi
      if [ -z "$(git diff --name-only --diff-filter=U)" ]; then echo "the merge failed without conflicts:"; git status --short | head -20; exit 2; fi
      echo "CONFLICTS merging $f into $dev:"; git diff --name-only --diff-filter=U; echo "CONFLICTS"; exit 0
    routes:
      - if: ^CONFLICTS\s*$
        goto: resolve_conflicts
    on_success: test_develop
    jump_only: true
  - id: resolve_conflicts
    type: claude
    jump_only: true
    max_visits: 3
    resume: implement
    prompt: |-
      Your finished change is being merged into the develop branch, and other work landed there meanwhile.
      The merge has conflicts (run `git status` and `git diff`):

      {{steps.merge_develop.output}}

      Resolve every conflict so that BOTH changes keep working: keep the other work and fit yours in.
      Remove all conflict markers, then `git add` the resolved files. Do not commit and do not run
      git merge, rebase or reset. Finish with one line per file saying how you resolved it.
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(git status*)
      - Bash(git diff*)
      - Bash(git add*)
      - Bash(git log*)
      - Bash(git show*)
    on_success: finish_merge
  - id: finish_merge
    type: shell
    jump_only: true
    run: |-
      left=$(git diff --name-only --diff-filter=U); [ -z "$left" ] || { echo "still unresolved:"; echo "$left"; exit 1; }
      markers=""; for f in $(git diff --cached --name-only); do [ -f "$f" ] && grep -qE "^(<<<<<<< |>>>>>>> )" "$f" && markers="$markers $f"; done
      [ -z "$markers" ] || { echo "conflict markers left in:$markers"; exit 1; }
      git commit -q --no-edit && echo "merge committed after resolving conflicts"
    on_success: test_develop
    on_failure: resolve_conflicts
  - id: test_develop
    type: shell
    timeout_sec: 3600
    description: The merged develop must pass the tests before it is pushed
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      if [ "$code" -ne 0 ]; then echo "the tests failed — running them once more (a test can fail by chance on a busy machine)"; touch "$marker"; sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?; [ "$code" -eq 0 ] && echo "passed the second time: a flaky test, not a real failure"; fi
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_success: push_develop
    on_failure: fix_develop
    jump_only: true
  - id: fix_develop
    type: claude
    jump_only: true
    max_visits: 2
    resume: implement
    prompt: |-
      Your change is merged into develop (not pushed yet), and the tests now fail. Fix that — in your code or
      where it meets the work that landed on develop meanwhile. Never weaken or delete tests. Do not commit.

      {{steps.test_develop.output}}
    on_success: commit_develop_fix
  - id: commit_develop_fix
    type: shell
    jump_only: true
    run: 'git add -A; if git diff --cached --quiet; then echo "the fix changed nothing — testing again"; else git commit -q -m "Fix #$FACTORY_VAR_ISSUE after merging into develop" && git log --oneline -1; fi'
    on_success: test_develop
  - id: push_develop
    type: shell
    description: Push develop; if it moved meanwhile, merge again
    run: |-
      dev="$FACTORY_VAR_DEVELOP_BRANCH"
      if git push -q origin "$dev"; then
        echo "PUSHED: $dev $(git rev-parse --short HEAD)"; "$FACTORY_TOOLS/area-lock" release "$FACTORY_RUN_ID" >/dev/null
        # Gitflow: the merged feature branch is no longer needed (its commits are in develop).
        f=$(cat "{{run.dir}}/feature-branch" 2>/dev/null)
        if [ "$FACTORY_VAR_DELETE_MERGED_BRANCHES" != no ] && [ -n "$f" ] && git merge-base --is-ancestor "$f" HEAD 2>/dev/null; then
          git push -q origin --delete "$f" 2>/dev/null && echo "deleted the merged branch $f"
        fi
        exit 0
      fi
      out=$(git push origin "$dev" 2>&1); printf '%s\n' "$out"
      if printf '%s\n' "$out" | grep -qE "rejected|fetch first|non-fast-forward"; then echo "develop moved meanwhile — merging again"; echo "MOVED"; exit 0; fi
      echo "pushing $dev failed (see above)"; exit 1
    routes:
      - if: ^MOVED\s*$
        goto: merge_develop
    on_success: report
  - id: merge_main
    type: shell
    jump_only: true
    max_visits: 4
    timeout_sec: 7200
    description: "Hotfix: merge the hotfix branch into the newest main (no fast-forward); nothing is pushed yet"
    run: |-
      [ -f "{{run.dir}}/hotfix" ] || { echo "this run is not a hotfix — nothing is merged into $FACTORY_VAR_MAIN_BRANCH"; exit 1; }
      [ "$FACTORY_HOTFIX" = on ] || { echo "hotfixes to $FACTORY_VAR_MAIN_BRANCH are not allowed for this run (the setting is off, or the flow is a changed copy) — nothing was pushed"; exit 1; }
      main="$FACTORY_VAR_MAIN_BRANCH"; h=$(cat "{{run.dir}}/hotfix-branch")
      git merge --abort >/dev/null 2>&1 || true
      if [ "$(git rev-parse --abbrev-ref HEAD)" = "$h" ] && [ -n "$(git status --porcelain)" ]; then
        git add -A && git commit -q -m "Resolve #$FACTORY_VAR_ISSUE: remaining changes" && git push -q origin "$h" && echo "committed and pushed changes left on $h"
      fi
      git fetch -q origin || { echo "cannot fetch from GitHub"; exit 2; }
      git rev-parse "origin/$main" > "{{run.dir}}/main-before"
      rm -f "{{run.dir}}/main-tested" "{{run.dir}}/main-sha"
      git checkout -q -B "$main" "origin/$main" || { echo "cannot switch to $main (see above)"; exit 2; }
      title=$(gh issue view "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --json title -q .title 2>/dev/null)
      if git merge --no-ff --no-edit -m "Merge #$FACTORY_VAR_ISSUE: $title ($h)" "$h" >/dev/null 2>&1; then echo "MERGED: $h into $main"; exit 0; fi
      if [ -z "$(git diff --name-only --diff-filter=U)" ]; then echo "the merge failed without conflicts:"; git status --short | head -20
      else echo "The fix on $h changed in the same places as $main did meanwhile:"; git diff --name-only --diff-filter=U; fi
      git merge --abort >/dev/null 2>&1
      echo "Nothing was pushed to $main. The branch $h is kept: delete it and start this issue again."; exit 1
    on_success: test_main
  - id: test_main
    type: shell
    jump_only: true
    timeout_sec: 3600
    description: "Hotfix: the merge result on main must pass the tests before it is pushed"
    run: |-
      [ -f "{{run.dir}}/hotfix" ] || { echo "this run is not a hotfix — nothing is merged into $FACTORY_VAR_MAIN_BRANCH"; exit 1; }
      [ "$FACTORY_HOTFIX" = on ] || { echo "hotfixes to $FACTORY_VAR_MAIN_BRANCH are not allowed for this run (the setting is off, or the flow is a changed copy) — nothing was pushed"; exit 1; }
      [ "$(git branch --show-current)" = "$FACTORY_VAR_MAIN_BRANCH" ] || { echo "not on $FACTORY_VAR_MAIN_BRANCH"; exit 1; }
      rm -f "{{run.dir}}/main-tested"; tested=$(git rev-parse HEAD)
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      if [ "$code" -ne 0 ]; then echo "the tests failed — running them once more (a test can fail by chance on a busy machine)"; touch "$marker"; sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?; [ "$code" -eq 0 ] && echo "passed the second time: a flaky test, not a real failure"; fi
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      if [ "$code" -eq 0 ]; then printf '%s\n' "$tested" > "{{run.dir}}/main-tested"; fi
      exit "$code"
    on_success: push_main
    on_failure: red_main
  - id: red_main
    type: shell
    jump_only: true
    run: |-
      tail -40 "{{run.dir}}/tests.log"
      echo "The tests fail on $FACTORY_VAR_MAIN_BRANCH with the fix merged in. Nothing was pushed to $FACTORY_VAR_MAIN_BRANCH."
      echo "The hotfix branch is kept. Fix the problem on it, or remove the hotfix label and build this issue as a feature."; exit 1
  - id: push_main
    type: shell
    jump_only: true
    description: "Hotfix: push main (the only step that may); if main moved meanwhile, merge and test again"
    run: |-
      [ -f "{{run.dir}}/hotfix" ] || { echo "this run is not a hotfix — nothing is merged into $FACTORY_VAR_MAIN_BRANCH"; exit 1; }
      [ "$FACTORY_HOTFIX" = on ] || { echo "hotfixes to $FACTORY_VAR_MAIN_BRANCH are not allowed for this run (the setting is off, or the flow is a changed copy) — nothing was pushed"; exit 1; }
      main="$FACTORY_VAR_MAIN_BRANCH"
      [ "$(git branch --show-current)" = "$main" ] || { echo "not on $main — nothing was pushed"; exit 1; }
      tested=$(cat "{{run.dir}}/main-tested" 2>/dev/null) || { echo "the merge result on $main did not pass the tests (or was not tested) — nothing was pushed to $main"; exit 1; }
      [ "$tested" = "$(git rev-parse HEAD)" ] || { echo "$main is not the commit that was tested — nothing was pushed to $main"; exit 1; }
      # If main moved meanwhile, merge again (the secret scan of the push could not even look at a main we do not have).
      git fetch -q origin "$main" 2>/dev/null; if ! git merge-base --is-ancestor "origin/$main" HEAD; then echo "$main moved meanwhile — merging again"; echo "MOVED"; exit 0; fi
      out=$(git push origin "$main" 2>&1); code=$?; printf '%s\n' "$out"
      if [ "$code" -eq 0 ]; then
        git rev-parse HEAD > "{{run.dir}}/main-sha"; echo "PUSHED: $main $(git rev-parse --short HEAD)"
        # The fix is on main: the issue is done now, it does not wait for the daily release.
        if [ "$FACTORY_VAR_CLOSE_WHEN_MERGED" != no ] && gh issue close "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --reason completed >/dev/null 2>&1; then echo "closed #$FACTORY_VAR_ISSUE"; fi
        exit 0
      fi
      if printf '%s\n' "$out" | grep -qE "GH006|GH013|Protected branch update failed|through a pull request"; then
        echo "$main on GitHub only accepts pull requests — allow direct pushes for the Foundry's account, or remove the hotfix label ($FACTORY_VAR_HOTFIX_LABELS) to build it as a feature. Nothing was pushed to $main."; exit 1
      fi
      if printf '%s\n' "$out" | grep -qE "\[rejected\]|fetch first|non-fast-forward|Invalid revision range"; then echo "$main moved meanwhile — merging again"; echo "MOVED"; exit 0; fi
      echo "pushing $main failed (see above) — nothing was pushed to $main"; exit 1
    routes:
      - if: ^MOVED\s*$
        goto: merge_main
    on_success: merge_back
  - id: merge_back
    type: shell
    jump_only: true
    max_visits: 4
    timeout_sec: 7200
    description: "Hotfix: merge main into develop (one merge at a time); conflicts go to an agent"
    run: |-
      [ -f "{{run.dir}}/hotfix" ] || { echo "this run is not a hotfix — nothing is merged into $FACTORY_VAR_MAIN_BRANCH"; exit 1; }
      [ "$FACTORY_HOTFIX" = on ] || { echo "hotfixes to $FACTORY_VAR_MAIN_BRANCH are not allowed for this run (the setting is off, or the flow is a changed copy) — nothing was pushed"; exit 1; }
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"
      behind() { echo "$1" > "{{run.dir}}/develop-behind"; echo "DEVELOP_BEHIND: $1"; exit 0; }
      rm -f "{{run.dir}}/develop-behind" "{{run.dir}}/back-red" "{{run.dir}}/back-unresolved"
      "$FACTORY_TOOLS/area-lock" acquire "$FACTORY_RUN_ID" "{{run.dir}}" @develop --wait-sec 7000 >/dev/null || behind "$dev stayed locked too long"
      git merge --abort >/dev/null 2>&1 || true
      git fetch -q origin || behind "cannot fetch from GitHub"
      git rev-parse -q --verify "origin/$dev" >/dev/null || behind "there is no $dev branch"
      git checkout -q -B "$dev" "origin/$dev" || behind "cannot switch to $dev"
      git rev-parse HEAD > "{{run.dir}}/develop-before"
      if git merge-base --is-ancestor "origin/$main" HEAD; then echo "UP_TO_DATE: $dev already has $main"; exit 0; fi
      if git merge --no-edit -m "Merge $main into $dev (hotfix #$FACTORY_VAR_ISSUE)" "origin/$main" >/dev/null 2>&1; then echo "MERGED: $main into $dev"; exit 0; fi
      [ -n "$(git diff --name-only --diff-filter=U)" ] || behind "the merge of $main into $dev failed without conflicts"
      echo "CONFLICTS merging $main into $dev:"; git diff --name-only --diff-filter=U; echo "CONFLICTS"; exit 0
    routes:
      - if: ^CONFLICTS\s*$
        goto: resolve_back
      - if: "^UP_TO_DATE:"
        goto: hotfix_done
      - if: "^DEVELOP_BEHIND:"
        goto: hotfix_done
    on_success: test_back
  - id: resolve_back
    type: claude
    jump_only: true
    max_visits: 3
    resume: implement
    prompt: |-
      Your finished change is being merged into the develop branch, and other work landed there meanwhile.
      This was a hotfix: it is already on main, and main is now merged into develop. The merge has conflicts (run `git status` and `git diff`):

      {{steps.merge_back.output}}

      Resolve every conflict so that BOTH changes keep working: keep the other work and fit yours in.
      Remove all conflict markers, then `git add` the resolved files. Do not commit and do not run
      git merge, rebase or reset. Finish with one line per file saying how you resolved it.
    allowed_tools:
      - Read
      - Edit
      - Write
      - Glob
      - Grep
      - Bash(git status*)
      - Bash(git diff*)
      - Bash(git add*)
      - Bash(git log*)
      - Bash(git show*)
    on_success: finish_back
  - id: finish_back
    type: shell
    jump_only: true
    run: |-
      fail() { echo "$1"; n=$(($(cat "{{run.dir}}/back-unresolved" 2>/dev/null || echo 0) + 1)); echo "$n" > "{{run.dir}}/back-unresolved"; [ "$n" -le 1 ] && exit 1
        git merge --abort >/dev/null 2>&1; echo "the conflicts could not be resolved" > "{{run.dir}}/develop-behind"; echo "DEVELOP_BEHIND: the conflicts could not be resolved"; exit 0; }
      left=$(git diff --name-only --diff-filter=U); [ -z "$left" ] || fail "still unresolved: $left"
      markers=""; for f in $(git diff --cached --name-only); do [ -f "$f" ] && grep -qE "^(<<<<<<< |>>>>>>> )" "$f" && markers="$markers $f"; done
      [ -z "$markers" ] || fail "conflict markers left in:$markers"
      if git commit -q --no-edit; then echo "merge committed after resolving conflicts"; else fail "the merge could not be committed"; fi
    routes:
      - if: "^DEVELOP_BEHIND:"
        goto: hotfix_done
    on_success: test_back
    on_failure: resolve_back
  - id: test_back
    type: shell
    jump_only: true
    timeout_sec: 3600
    description: "Hotfix: develop with main merged in must pass the tests before it is pushed"
    run: |-
      git add -A -N >/dev/null 2>&1 || true   # new files show up in git diff for reviewers
      cmd="$FACTORY_VAR_TEST_CMD"
      if [ -z "$cmd" ] || [ "$cmd" = auto ]; then cmd=$("$FACTORY_TOOLS/detect-commands" test); fi
      if [ -z "$cmd" ]; then echo "no test command found (set var test_cmd)"; exit 1; fi
      marker="{{run.dir}}/tests.marker"; touch "$marker"
      echo "\$ $cmd"
      sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?
      if [ "$code" -ne 0 ]; then echo "the tests failed — running them once more (a test can fail by chance on a busy machine)"; touch "$marker"; sh -c "$cmd" > "{{run.dir}}/tests.log" 2>&1; code=$?; [ "$code" -eq 0 ] && echo "passed the second time: a flaky test, not a real failure"; fi
      tail -150 "{{run.dir}}/tests.log"
      echo; echo "=== summary ==="
      { "$FACTORY_TOOLS/test-summary" "$marker"; [ "$code" -eq 0 ] && echo "result: PASSED" || echo "result: FAILED (exit $code)"; } | tee "{{run.dir}}/last-tests.txt"
      exit "$code"
    on_success: push_back
    on_failure: red_back
  - id: red_back
    type: shell
    jump_only: true
    run: |-
      dev="$FACTORY_VAR_DEVELOP_BRANCH"; main="$FACTORY_VAR_MAIN_BRANCH"
      n=$(($(cat "{{run.dir}}/back-red" 2>/dev/null || echo 0) + 1)); echo "$n" > "{{run.dir}}/back-red"
      if [ "$n" -le 2 ]; then echo "the tests fail on the merge result — fix attempt $n of 2"; exit 0; fi
      why="the tests still fail on $dev with $main merged in, after 2 fix attempts"; echo "$why" > "{{run.dir}}/develop-behind"; echo "DEVELOP_BEHIND: $why"; exit 0
    routes:
      - if: "^DEVELOP_BEHIND:"
        goto: hotfix_done
    on_success: fix_back
  - id: fix_back
    type: claude
    jump_only: true
    max_visits: 2
    resume: implement
    prompt: |-
      Your change is merged into develop (not pushed yet), and the tests now fail. Fix that — in your code or
      where it meets the work that landed on develop meanwhile. Never weaken or delete tests. Do not commit.

      {{steps.test_back.output}}
    on_success: commit_back_fix
  - id: commit_back_fix
    type: shell
    jump_only: true
    run: 'git add -A; if git diff --cached --quiet; then echo "the fix changed nothing — testing again"; else git commit -q -m "Fix #$FACTORY_VAR_ISSUE after merging main into develop" && git log --oneline -1; fi'
    on_success: test_back
  - id: push_back
    type: shell
    jump_only: true
    description: "Hotfix: push develop; if it moved meanwhile, merge again"
    run: |-
      dev="$FACTORY_VAR_DEVELOP_BRANCH"
      behind() { echo "$1" > "{{run.dir}}/develop-behind"; echo "DEVELOP_BEHIND: $1"; exit 0; }
      out=$(git push origin "$dev" 2>&1); code=$?; printf '%s\n' "$out"
      if [ "$code" -eq 0 ]; then echo "PUSHED: $dev $(git rev-parse --short HEAD)"; exit 0; fi
      if printf '%s\n' "$out" | grep -qE "rejected|fetch first|non-fast-forward|Invalid revision range"; then echo "$dev moved meanwhile — merging again"; echo "MOVED"; exit 0; fi
      behind "pushing $dev failed (see above)"
    routes:
      - if: ^MOVED\s*$
        goto: merge_back
      - if: "^DEVELOP_BEHIND:"
        goto: hotfix_done
    on_success: hotfix_done
  - id: hotfix_done
    type: shell
    jump_only: true
    description: "Hotfix: free the locks, delete the merged branch, check whether the running Foundry has the fix"
    run: |-
      main="$FACTORY_VAR_MAIN_BRANCH"; dev="$FACTORY_VAR_DEVELOP_BRANCH"; h=$(cat "{{run.dir}}/hotfix-branch"); sha=$(cat "{{run.dir}}/main-sha" 2>/dev/null) || { echo "the fix is not on $main in this run"; exit 1; }
      git merge --abort >/dev/null 2>&1; "$FACTORY_TOOLS/area-lock" release "$FACTORY_RUN_ID" >/dev/null
      git fetch -q origin 2>/dev/null; echo "MAIN: $sha"
      if git merge-base --is-ancestor "$sha" "origin/$dev" 2>/dev/null; then echo "DEVELOP: merged"
        if [ "$FACTORY_VAR_DELETE_MERGED_BRANCHES" != no ] && git ls-remote --exit-code --heads origin "$h" >/dev/null 2>&1; then
          # Only delete what was merged: someone may have added commits to the branch after the merge.
          tip=$(git rev-parse "origin/$h" 2>/dev/null)
          if [ -z "$tip" ] || ! git merge-base --is-ancestor "$tip" "origin/$dev" 2>/dev/null; then echo "BRANCH: kept — unmerged commits on $h"
          elif git push -q --force-with-lease="refs/heads/$h:$tip" origin ":refs/heads/$h" 2>/dev/null; then echo "deleted the merged branch $h"; else echo "BRANCH: kept — $h could not be deleted"; fi; fi
      else why=$(cat "{{run.dir}}/develop-behind" 2>/dev/null); echo "DEVELOP: behind — ${why:-the merge into $dev did not finish (see this run)}"; fi
      if [ -n "$FACTORY_SELF_REPO" ] && [ "$FACTORY_SELF_REPO" = "$(printf '%s' "$FACTORY_VAR_GITHUB_REPO" | tr '[:upper:]' '[:lower:]')" ]; then
        if ! git cat-file -e "$FACTORY_SELF_SHA^{commit}" 2>/dev/null; then echo "FOUNDRY: unknown"
        elif git merge-base --is-ancestor "$sha" "$FACTORY_SELF_SHA" 2>/dev/null; then echo "FOUNDRY: has the fix"; else echo "FOUNDRY: not yet"; fi; fi
      exit 0
    on_success: report
  - id: report
    type: shell
    run: |-
      main="$FACTORY_VAR_MAIN_BRANCH"; dev="$FACTORY_VAR_DEVELOP_BRANCH"; warn=""; closed=""; note=$(cat "{{run.dir}}/hotfix-note" 2>/dev/null)
      if [ ! -f "{{run.dir}}/hotfix-branch" ]; then
        branch=$(cat "{{run.dir}}/feature-branch"); sha=$(git rev-parse HEAD); from=$(cat "{{run.dir}}/develop-before")
        first="$FACTORY_FIRST_SHIPS"
        did="implemented this on \`$branch\` and merged it into \`$dev\` (commit https://github.com/$FACTORY_VAR_GITHUB_REPO/commit/$sha)."
        last="It goes to \`$main\` with the daily release pull request."
      else
        h=$(cat "{{run.dir}}/hotfix-branch"); sha=$(cat "{{run.dir}}/main-sha"); from=$(cat "{{run.dir}}/main-before")
        foundry=""; fl=$(printf '%s\n' "$FACTORY_OUT_HOTFIX_DONE" | sed -n 's/^FOUNDRY: *//p' | tail -1)
        case "$fl" in
          "has the fix") foundry=" The running Foundry already has this fix." ;;
          "not yet") foundry=" The running Foundry does not have this fix yet: it gets it when its own copy is updated, built and started again." ;;
          unknown) foundry=" Whether the running Foundry has this fix could not be checked." ;;
        esac
        if printf '%s\n' "$FACTORY_OUT_HOTFIX_DONE" | grep -q "^DEVELOP: merged"; then
          first="$FACTORY_FIRST_FIXED"
          did="fixed this on \`$main\` as a hotfix (\`$h\`, commit https://github.com/$FACTORY_VAR_GITHUB_REPO/commit/$sha) and merged \`$main\` into \`$dev\`."
          last="The fix is on \`$main\` and in \`$dev\`.$foundry"
        else
          why=$(printf '%s\n' "$FACTORY_OUT_HOTFIX_DONE" | sed -n 's/^DEVELOP: behind — //p' | tail -1)
          first="$FACTORY_FIRST_MERGE_BACK"
          did="fixed this on \`$main\` as a hotfix (\`$h\`, commit https://github.com/$FACTORY_VAR_GITHUB_REPO/commit/$sha)."
          warn="⚠ **\`$dev\` does not have this fix yet:** $why. The Foundry tries again when it starts the next story, which works only without conflicts. To be sure, merge \`$main\` into \`$dev\` yourself — until then the daily release pull request can show conflicts."
          last="The fix is on \`$main\`, not yet in \`$dev\`.$foundry"
        fi
        if printf '%s\n' "$FACTORY_OUT_HOTFIX_DONE" | grep -q "^BRANCH: kept — unmerged"; then last="$last The branch \`$h\` was not deleted: it has commits that are not in \`$dev\` — look at them first."
        elif printf '%s\n' "$FACTORY_OUT_HOTFIX_DONE" | grep -q "^BRANCH: kept"; then last="$last The branch \`$h\` could not be deleted — delete it by hand."; fi
        # push_main closed the issue; if that did not work, try again and say so when it fails too.
        if printf '%s\n' "$FACTORY_OUT_PUSH_MAIN" | grep -q "^closed #"; then closed=yes
        elif [ "$FACTORY_VAR_CLOSE_WHEN_MERGED" != no ]; then
          if gh issue close "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --reason completed >/dev/null 2>&1; then closed=yes; else warn="${warn:+$warn }⚠ This issue could not be closed — close it by hand."; fi
        fi
      fi
      verdict() { printf '%s\n' "$1" | sed -n 's/^VERDICT: *//p' | tail -1; }
      { echo "$first"; echo
        echo "🤖 **Spaghetti Code Foundry** $did"
        [ -n "$warn" ] && { echo; echo "$warn"; }
        echo; echo "### What was done"; printf '%s\n' "$FACTORY_OUT_IMPLEMENT"
        echo; echo "### Review (Codex)"
        echo "- round 1: $(verdict "$FACTORY_OUT_REVIEW_1")"
        [ -n "$FACTORY_OUT_REVIEW_2" ] && echo "- round 2: $(verdict "$FACTORY_OUT_REVIEW_2")"
        echo; echo "### Tests"; echo '```'; cat "{{run.dir}}/last-tests.txt"; echo '```'
        echo; echo "### Files changed"; echo '```'; git diff --stat "$from" "$sha" | tail -40; echo '```'
        [ -n "$note" ] && { echo; echo "$note"; }
        echo; echo "_${last}_"
        echo; echo "<!-- claude-factory run=$FACTORY_RUN_ID -->"; } \
        | gh issue comment "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --body-file - ; posted=$?
      # A hotfix is done when it is on main (already closed above); the issue is not waiting for the release.
      # Without its report the run is not done: fail, and a resume from report posts it again.
      if [ -f "{{run.dir}}/hotfix-branch" ]; then
        [ "$posted" -eq 0 ] || { echo "the fix is on $main, but the report could not be posted on the issue — resume this run at the report step"; exit 1; }
        [ -n "$closed" ] && echo "closed #$FACTORY_VAR_ISSUE"; exit 0
      fi
      # Gitflow: "done" means merged into develop — close the issue now (GitHub only closes issues by
      # itself when work reaches the default branch).
      if [ "$FACTORY_VAR_CLOSE_WHEN_MERGED" != no ]; then
        gh issue close "$FACTORY_VAR_ISSUE" --repo "$FACTORY_VAR_GITHUB_REPO" --reason completed >/dev/null 2>&1 && echo "closed #$FACTORY_VAR_ISSUE"
      fi
    on_success: end
  - id: baseline_failed
    type: shell
    jump_only: true
    run: echo "The tests already fail on $(git branch --show-current) before any change — not starting."; tail -40 "{{run.dir}}/tests.log"; exit 1
